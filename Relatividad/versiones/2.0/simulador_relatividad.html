<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador de Relatividad</title>
<style>
:root{--bg:#0a0e1a;--panel:#111827;--card:#1a2236;--border:#2a3454;--accent:#3b82f6;--accent2:#6366f1;--text:#e2e8f0;--muted:#94a3b8;--green:#22c55e;--red:#ef4444;--gold:#f59e0b;--radius:12px;--shadow:0 8px 32px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
.app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:240px 1fr;height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--border)}
header .logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:-.02em}
header .logo i{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-style:normal;font-size:18px}
header .logo small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.toggle-mode{display:flex;background:var(--card);border-radius:999px;padding:3px;margin-left:24px}
.toggle-mode button{border:none;padding:8px 20px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;transition:.2s;background:transparent;color:var(--muted)}
.toggle-mode button.active{background:var(--accent);color:#fff}
header .spacer{flex:1}
header .hbtn{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
aside{background:var(--panel);border-right:1px solid var(--border);padding:16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
aside .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);transition:.15s}
aside .nav-item:hover{background:rgba(59,130,246,.1);color:var(--text)}
aside .nav-item.active{background:var(--accent);color:#fff}
aside .nav-item .icon{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
aside .nav-item.active .icon{background:rgba(255,255,255,.2)}
aside .controls-box{margin-top:auto;padding:14px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border)}
aside .controls-box h4{font-size:12px;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em}
aside .ctrl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px}
aside .ctrl-row span{color:var(--muted)}
aside .ctrl-row strong{color:var(--accent)}
aside input[type=range]{width:100%;accent-color:var(--accent);margin-bottom:6px}
aside .btn-reset{width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-weight:700;font-size:13px;cursor:pointer;margin-top:8px}
main{overflow-y:auto;padding:20px;display:grid;gap:16px}
main.cols-2{grid-template-columns:1fr 1fr}
main.cols-3{grid-template-columns:1fr 1fr 1fr}
.sim-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.sim-card .card-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)}
.sim-card .card-head .num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sim-card .card-head h3{font-size:15px;font-weight:700;flex:1}
.sim-card .card-head small{color:var(--muted);font-size:11px;display:block}
.sim-card .card-body{flex:1;display:flex;flex-direction:column;padding:12px}
.sim-card canvas{width:100%;border-radius:8px;background:#0d1424}
.sim-card .card-controls{padding:10px 16px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12px}
.sim-card .card-controls label{color:var(--muted);font-weight:600}
.sim-card .card-controls input[type=range]{width:120px;accent-color:var(--accent)}
.sim-card .card-controls .val{color:var(--accent);font-weight:800;min-width:50px}
.sim-card .readout{display:inline-flex;flex-direction:column;padding:6px 10px;background:rgba(59,130,246,.1);border-radius:8px;border:1px solid rgba(59,130,246,.2)}
.sim-card .readout span{font-size:10px;color:var(--muted);text-transform:uppercase}
.sim-card .readout strong{font-size:16px;color:var(--accent)}
.dual-view{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dual-view canvas{height:200px}
.view-label{position:absolute;top:6px;left:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px}
footer{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:8px 24px;background:var(--panel);border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
footer .spacer{flex:1}
footer button{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer}
.page{display:none}
.page.active{display:grid}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{display:none}}
</style>
</head><body>
<div class="app">
<header>
<div class="logo"><i>⚡</i><div>Relatividad<small>Interactiva</small></div></div>
<div class="toggle-mode">
<button class="active" onclick="setMode('special')">Relatividad especial</button>
<button onclick="setMode('general')">Relatividad general</button>
</div>
<div class="spacer"></div>
<button class="hbtn">📖 Teoría</button>
<button class="hbtn">❓ Ayuda</button>
</header>
<aside id="sidebar"></aside>
<main id="main"></main>
<footer>
<span>c = 299 792 458 m/s &nbsp;|&nbsp; G = 6.674×10⁻¹¹ m³/(kg·s²)</span>
<div class="spacer"></div>
<button onclick="location.reload()">↻ Reiniciar simulación</button>
</footer>
</div>
<script>
const C=299792458,G_CONST=6.674e-11;
const gamma=v=>1/Math.sqrt(1-v*v);
let mode='special',page='light-clock',globalV=0.6,globalScale=1;
const PAGES={special:[
{id:'two-obs',icon:'👁',name:'Dos observadores'},
{id:'bicycle',icon:'🚲',name:'Bicicleta de Einstein'},
{id:'muon',icon:'☄',name:'Muón y rayos cósmicos'},
{id:'light-clock',icon:'⏱',name:'Reloj de luz'},
{id:'barn',icon:'🏠',name:'Paradoja lanza-granero'},
{id:'more-sr',icon:'🔬',name:'Más experimentos'}
],general:[
{id:'elevator',icon:'🛗',name:'Ascensor de Einstein'},
{id:'tower',icon:'🗼',name:'Reloj en torre'},
{id:'horizon',icon:'⚫',name:'Horizonte de sucesos'},
{id:'lensing',icon:'🔭',name:'Lente gravitacional'},
{id:'spaghetti',icon:'🍝',name:'Espaguetización'}
]};
function setMode(m){mode=m;document.querySelectorAll('.toggle-mode button').forEach((b,i)=>b.classList.toggle('active',i===(m==='special'?0:1)));page=PAGES[m][0].id;buildSidebar();buildMain()}
function buildSidebar(){const sb=document.getElementById('sidebar');const items=PAGES[mode];sb.innerHTML=items.map(p=>`<div class="nav-item ${p.id===page?'active':''}" onclick="navTo('${p.id}')"><div class="icon">${p.icon}</div><span>${p.name}</span></div>`).join('')+`<div class="controls-box"><h4>Controles globales</h4><div class="ctrl-row"><span>Velocidad v</span><strong id="gvDisp">${globalV.toFixed(2)} c</strong></div><input type="range" min="0" max="99" value="${globalV*100}" oninput="globalV=this.value/100;document.getElementById('gvDisp').textContent=globalV.toFixed(2)+' c'"><div class="ctrl-row"><span>Factor γ</span><strong id="ggDisp">${gamma(globalV).toFixed(3)}</strong></div><button class="btn-reset" onclick="globalV=0.6;buildSidebar()">↻ Reiniciar todo</button></div>`}
function navTo(id){page=id;buildSidebar();buildMain()}
function buildMain(){const m=document.getElementById('main');m.className='';m.innerHTML='';const fn={
'light-clock':buildLightClock,'two-obs':buildTwoObs,'bicycle':buildBicycle,'muon':buildMuon,'barn':buildBarn,'more-sr':buildMoreSR,
'elevator':buildElevator,'tower':buildTower,'horizon':buildHorizon,'lensing':buildLensing,'spaghetti':buildSpaghetti
}[page];if(fn)fn(m);else m.innerHTML='<div class="sim-card" style="grid-column:1/-1;padding:40px;text-align:center"><h3>🚧 En construcción</h3><p style="color:var(--muted);margin-top:8px">Esta simulación se añadirá próximamente.</p></div>'}
/* ===== LIGHT CLOCK ===== */
function buildLightClock(m){
m.classList.add('cols-2');
m.innerHTML=`<div class="sim-card" style="grid-column:1/-1"><div class="card-head"><div class="num">4</div><div><h3>Reloj de luz</h3><small>La dilatación temporal en acción.</small></div></div><div class="card-body"><div class="dual-view"><div style="position:relative;text-align:center"><div style="color:var(--muted);font-size:11px;font-weight:700;margin-bottom:4px">Reloj en reposo</div><canvas id="lcRest" width="400" height="300"></canvas></div><div style="position:relative;text-align:center"><div style="color:var(--muted);font-size:11px;font-weight:700;margin-bottom:4px">Reloj en movimiento (v →)</div><canvas id="lcMove" width="400" height="300"></canvas></div></div><div style="display:flex;gap:16px;justify-content:center;margin-top:12px"><div class="readout"><span>Δτ (propio)</span><strong id="lcTau">2.00 ns</strong></div><div class="readout"><span>Longitud contraída L</span><strong id="lcL">1.60 m</strong></div><div class="readout"><span>Δt (observado)</span><strong id="lcDt">2.50 ns</strong></div></div></div><div class="card-controls"><button id="lcPlay" onclick="lcToggle()" style="background:var(--accent);color:#fff;border:none;padding:6px 16px;border-radius:8px;font-weight:700;cursor:pointer">▶</button><label>Velocidad v</label><input type="range" id="lcV" min="0" max="99" value="60" oninput="lcUpdateV()"><span class="val" id="lcVdisp">0.60 c</span><label style="margin-left:auto">Mostrar traza</label><input type="checkbox" id="lcTrace" checked></div></div>`;
lcInit()}
let lcAnim=null,lcRunning=false,lcTime=0;
function lcToggle(){lcRunning=!lcRunning;document.getElementById('lcPlay').textContent=lcRunning?'⏸':'▶';if(lcRunning&&!lcAnim)lcAnim=requestAnimationFrame(lcLoop)}
function lcUpdateV(){const v=document.getElementById('lcV').value/100;document.getElementById('lcVdisp').textContent=v.toFixed(2)+' c';const g=gamma(v),L0=2,tau=2;document.getElementById('lcTau').textContent=tau.toFixed(2)+' ns';document.getElementById('lcL').textContent=(L0/g).toFixed(2)+' m';document.getElementById('lcDt').textContent=(tau*g).toFixed(2)+' ns'}
function lcInit(){lcUpdateV();lcRunning=true;document.getElementById('lcPlay').textContent='⏸';lcAnim=requestAnimationFrame(lcLoop)}
function lcLoop(ts){if(!lcRunning){lcAnim=null;return}lcTime+=.02;const v=document.getElementById('lcV').value/100;const trace=document.getElementById('lcTrace').checked;lcDrawRest();lcDrawMove(v,trace);lcAnim=requestAnimationFrame(lcLoop)}
function lcDrawRest(){const c=document.getElementById('lcRest');if(!c)return;const ctx=c.getContext('2d');const W=c.width,H=c.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1424';ctx.fillRect(0,0,W,H);const mx=W/2,topY=50,botY=H-50;ctx.strokeStyle='#2a3454';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(mx-20,topY);ctx.lineTo(mx-20,botY);ctx.moveTo(mx+20,topY);ctx.lineTo(mx+20,botY);ctx.stroke();ctx.strokeStyle='rgba(59,130,246,.3)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(mx,topY);ctx.lineTo(mx,botY);ctx.stroke();ctx.setLineDash([]);const period=2,t=lcTime%period,frac=t/period;const goingUp=frac<.5;const pos=goingUp?frac*2:(1-(frac-.5)*2);const ballY=botY-(botY-topY)*pos;ctx.beginPath();ctx.arc(mx,ballY,8,0,Math.PI*2);ctx.fillStyle='#f59e0b';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()}
function lcDrawMove(v,trace){const c=document.getElementById('lcMove');if(!c)return;const ctx=c.getContext('2d');const W=c.width,H=c.height;if(!trace)ctx.clearRect(0,0,W,H);else{ctx.fillStyle='rgba(13,20,36,.08)';ctx.fillRect(0,0,W,H)}const g=gamma(v),topY=50,botY=H-50,mw=40/g;const period=2*g,t=lcTime%period,frac=t/period;const goingUp=frac<.5;const pos=goingUp?frac*2:(1-(frac-.5)*2);const ballY=botY-(botY-topY)*pos;const xOffset=(t/period)*W*.6+W*.2;const hw=mw/2;if(!trace){ctx.fillStyle='#0d1424';ctx.fillRect(0,0,W,H)}ctx.strokeStyle='#2a3454';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xOffset-hw,topY);ctx.lineTo(xOffset-hw,botY);ctx.moveTo(xOffset+hw,topY);ctx.lineTo(xOffset+hw,botY);ctx.stroke();ctx.beginPath();ctx.arc(xOffset,ballY,7,0,Math.PI*2);ctx.fillStyle='#f59e0b';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()}
/* ===== TWO OBSERVERS ===== */
function buildTwoObs(m){
m.innerHTML=`<div class="sim-card" style="grid-column:1/-1"><div class="card-head"><div class="num">1</div><div><h3>Dos observadores</h3><small>Diagrama espacio-tiempo de Minkowski con transformación de Lorentz.</small></div></div><div class="card-body"><canvas id="toCanvas" width="700" height="420"></canvas><div style="display:flex;gap:16px;justify-content:center;margin-top:10px"><div class="readout"><span>Marco S (estación)</span><strong style="color:#22c55e">Verde</strong></div><div class="readout"><span>Marco S' (tren)</span><strong style="color:#f59e0b">Dorado</strong></div></div></div><div class="card-controls"><label>Velocidad v</label><input type="range" id="toV" min="0" max="95" value="50" oninput="toDraw()"><span class="val" id="toVd">0.50 c</span><label>Mostrar conos de luz</label><input type="checkbox" id="toCone" checked onchange="toDraw()"></div></div>`;toDraw()}
function toDraw(){const cv=document.getElementById('toCanvas');if(!cv)return;const ctx=cv.getContext('2d'),W=cv.width,H=cv.height,cx=W/2,cy=H/2;const v=document.getElementById('toV').value/100;document.getElementById('toVd').textContent=v.toFixed(2)+' c';const sc=3;ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1424';ctx.fillRect(0,0,W,H);
/* grid */ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;for(let i=-10;i<=10;i++){ctx.beginPath();ctx.moveTo(cx+i*30*sc,0);ctx.lineTo(cx+i*30*sc,H);ctx.stroke();ctx.beginPath();ctx.moveTo(0,cy-i*30*sc);ctx.lineTo(W,cy-i*30*sc);ctx.stroke()}
/* S axes */ctx.strokeStyle='#22c55e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(W,cy);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,H);ctx.stroke();ctx.fillStyle='#22c55e';ctx.font='bold 13px sans-serif';ctx.fillText("x (m)",W-40,cy-8);ctx.fillText("ct (s)",cx+8,14);
/* light cones */if(document.getElementById('toCone')?.checked){ctx.strokeStyle='rgba(59,130,246,.25)';ctx.lineWidth=1;ctx.setLineDash([6,4]);const r=200;ctx.beginPath();ctx.moveTo(cx-r,cy+r);ctx.lineTo(cx,cy);ctx.lineTo(cx+r,cy+r);ctx.stroke();ctx.beginPath();ctx.moveTo(cx-r,cy-r);ctx.lineTo(cx,cy);ctx.lineTo(cx+r,cy-r);ctx.stroke();ctx.setLineDash([])}
/* S' axes */if(v>0){const ang=Math.atan(v);ctx.save();ctx.strokeStyle='#f59e0b';ctx.lineWidth=2;ctx.setLineDash([8,4]);ctx.translate(cx,cy);/* ct' axis */ctx.beginPath();ctx.moveTo(-200*Math.sin(ang),200*Math.cos(ang));ctx.lineTo(200*Math.sin(ang),-200*Math.cos(ang));ctx.stroke();/* x' axis */ctx.beginPath();ctx.moveTo(-200*Math.cos(ang),200*Math.sin(ang));ctx.lineTo(200*Math.cos(ang),-200*Math.sin(ang));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#f59e0b';ctx.font='bold 12px sans-serif';ctx.fillText("x'",200*Math.cos(ang)+5,-200*Math.sin(ang)-5);ctx.fillText("ct'",200*Math.sin(ang)+5,-200*Math.cos(ang)+15);ctx.restore()}
/* events */const evts=[{x:80,ct:-50,label:'A',color:'#ef4444'},{x:200,ct:60,label:'B',color:'#3b82f6'}];const g=gamma(v);evts.forEach(e=>{const px=cx+e.x*sc,py=cy-e.ct*sc;ctx.beginPath();ctx.arc(px,py,7,0,Math.PI*2);ctx.fillStyle=e.color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.fillText(e.label,px+10,py-10);/* transformed coords */const xp=g*(e.x-v*e.ct),ctp=g*(e.ct-v*e.x);ctx.fillStyle=e.color;ctx.font='11px sans-serif';ctx.fillText(`S: (${e.x}, ${e.ct})`,px+10,py+5);ctx.fillStyle='#f59e0b';ctx.fillText(`S': (${xp.toFixed(0)}, ${ctp.toFixed(0)})`,px+10,py+18)})}
/* ===== BICYCLE ===== */
let bikeAnim=null,bikeTime=0,bikeRunning=true;
function buildBicycle(m){
m.innerHTML=`<div class="sim-card" style="grid-column:1/-1"><div class="card-head"><div class="num">2</div><div><h3>Bicicleta de Einstein</h3><small>Contracción de longitud a velocidades relativistas.</small></div></div><div class="card-body"><canvas id="bikeCanvas" width="700" height="340"></canvas><div style="display:flex;gap:16px;justify-content:center;margin-top:10px"><div class="readout"><span>Longitud propia (L₀)</span><strong id="bikeL0">2.00 m</strong></div><div class="readout"><span>Longitud observada</span><strong id="bikeLobs">1.60 m</strong></div><div class="readout"><span>Factor γ</span><strong id="bikeGamma">1.250</strong></div></div></div><div class="card-controls"><button id="bikePlay" onclick="bikeToggle()" style="background:var(--accent);color:#fff;border:none;padding:6px 16px;border-radius:8px;font-weight:700;cursor:pointer">⏸</button><label>Velocidad v</label><input type="range" id="bikeV" min="0" max="99" value="60" oninput="bikeUpdate()"><span class="val" id="bikeVd">0.60 c</span></div></div>`;
bikeUpdate();bikeRunning=true;bikeAnim=requestAnimationFrame(bikeLoop)}
function bikeToggle(){bikeRunning=!bikeRunning;document.getElementById('bikePlay').textContent=bikeRunning?'⏸':'▶';if(bikeRunning)bikeAnim=requestAnimationFrame(bikeLoop)}
function bikeUpdate(){const v=document.getElementById('bikeV').value/100;document.getElementById('bikeVd').textContent=v.toFixed(2)+' c';const g=gamma(v),L0=2;document.getElementById('bikeL0').textContent=L0.toFixed(2)+' m';document.getElementById('bikeLobs').textContent=(L0/g).toFixed(2)+' m';document.getElementById('bikeGamma').textContent=g.toFixed(3)}
function bikeLoop(){if(!bikeRunning){bikeAnim=null;return}bikeTime+=.03;bikeDraw();bikeAnim=requestAnimationFrame(bikeLoop)}
function bikeDraw(){const cv=document.getElementById('bikeCanvas');if(!cv)return;const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;const v=document.getElementById('bikeV').value/100,g=gamma(v);ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1424';ctx.fillRect(0,0,W,H);
/* road */ctx.fillStyle='#1a2236';ctx.fillRect(0,H-60,W,60);ctx.strokeStyle='#f59e0b';ctx.lineWidth=2;ctx.setLineDash([20,15]);ctx.beginPath();ctx.moveTo(0,H-60);ctx.lineTo(W,H-60);ctx.stroke();ctx.setLineDash([]);
/* observer */ctx.fillStyle='#94a3b8';ctx.font='30px sans-serif';ctx.fillText('🧍',30,H-65);ctx.fillStyle='#94a3b8';ctx.font='bold 11px sans-serif';ctx.fillText('Observador',15,H-20);
/* bike position */const bikeX=((bikeTime*v*150)%((W+200)))-100;const bikeW=120/g,bikeH=80,bx=bikeX,by=H-65-bikeH;
/* bike body - contracted */ctx.save();ctx.translate(bx,by);ctx.scale(1/g,1);
/* wheels */ctx.strokeStyle='#64748b';ctx.lineWidth=3*g;ctx.beginPath();ctx.arc(20*g,bikeH-10,18,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(100*g,bikeH-10,18,0,Math.PI*2);ctx.stroke();
/* spokes animation */const spokeAng=bikeTime*v*8;for(let w of[20*g,100*g]){for(let i=0;i<4;i++){const a=spokeAng+i*Math.PI/2;ctx.beginPath();ctx.moveTo(w,bikeH-10);ctx.lineTo(w+Math.cos(a)*14,bikeH-10+Math.sin(a)*14);ctx.strokeStyle='#475569';ctx.lineWidth=1*g;ctx.stroke()}}
/* frame */ctx.strokeStyle='#3b82f6';ctx.lineWidth=3*g;ctx.beginPath();ctx.moveTo(20*g,bikeH-10);ctx.lineTo(55*g,bikeH-50);ctx.lineTo(100*g,bikeH-10);ctx.stroke();ctx.beginPath();ctx.moveTo(55*g,bikeH-50);ctx.lineTo(55*g,bikeH-70);ctx.stroke();
/* Einstein figure */ctx.fillStyle='#e2e8f0';ctx.font=`${28*g}px sans-serif`;ctx.fillText('🧑‍🔬',42*g,bikeH-58);
ctx.restore();
/* speed label */ctx.fillStyle='var(--accent)';ctx.font='bold 14px sans-serif';ctx.fillText(`v = ${v.toFixed(2)}c`,W-120,30);ctx.fillStyle='#f59e0b';ctx.font='bold 12px sans-serif';ctx.fillText(`γ = ${g.toFixed(2)}`,W-120,48)}
/* ===== MUON ===== */
let muonAnim=null,muonTime=0,muonRun=true;
function buildMuon(m){m.innerHTML=`<div class="sim-card" style="grid-column:1/-1"><div class="card-head"><div class="num">3</div><div><h3>Muón y rayos cósmicos</h3><small>¿Por qué llegan los muones a la Tierra?</small></div></div><div class="card-body"><div class="dual-view"><div style="text-align:center"><div style="color:var(--muted);font-size:11px;font-weight:700;margin-bottom:4px">Marco de la Tierra</div><canvas id="muEarth" width="340" height="360"></canvas></div><div style="text-align:center"><div style="color:var(--muted);font-size:11px;font-weight:700;margin-bottom:4px">Marco del muón</div><canvas id="muMuon" width="340" height="360"></canvas></div></div><div style="display:flex;gap:16px;justify-content:center;margin-top:10px"><div class="readout"><span>Tiempo observado (t)</span><strong id="muTobs">0.00 μs</strong></div><div class="readout"><span>Tiempo propio (τ)</span><strong id="muTau">0.00 μs</strong></div><div class="readout"><span>Vida media muón</span><strong>2.2 μs</strong></div></div></div><div class="card-controls"><button id="muPlay" onclick="muonRun=!muonRun;this.textContent=muonRun?'⏸':'▶';if(muonRun)muonAnim=requestAnimationFrame(muonLoop)" style="background:var(--accent);color:#fff;border:none;padding:6px 16px;border-radius:8px;font-weight:700;cursor:pointer">⏸</button><label>Velocidad del muón</label><input type="range" id="muV" min="90" max="9999" value="9800" oninput="document.getElementById('muVd').textContent=(this.value/10000).toFixed(4)+' c'"><span class="val" id="muVd">0.9800 c</span><button onclick="muonTime=0" style="background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;font-weight:700;cursor:pointer">↻ Reset</button></div></div>`;muonTime=0;muonRun=true;muonAnim=requestAnimationFrame(muonLoop)}
function muonLoop(){if(!muonRun){muonAnim=null;return}muonTime+=0.016;muonDraw();muonAnim=requestAnimationFrame(muonLoop)}
function muonDraw(){const v=document.getElementById('muV').value/10000,g=gamma(v),H0=15000,lifetime=2.2;const tMax=H0/(v*3e8)*1e6;const progress=Math.min(muonTime*2/tMax,1);const tObs=(progress*tMax).toFixed(2),tProp=(progress*tMax/g).toFixed(2);document.getElementById('muTobs').textContent=tObs+' μs';document.getElementById('muTau').textContent=tProp+' μs';
/* Earth frame */const ce=document.getElementById('muEarth');if(!ce)return;const cx=ce.getContext('2d'),W=ce.width,HH=ce.height;cx.clearRect(0,0,W,HH);cx.fillStyle='#0a0e2a';cx.fillRect(0,0,W,HH);/* stars */for(let i=0;i<20;i++){cx.fillStyle=`rgba(255,255,255,${.2+Math.random()*.5})`;cx.fillRect(50+i*14,10+((i*37)%200),2,2)}/* atmosphere */cx.fillStyle='rgba(59,130,246,.08)';cx.fillRect(0,HH-120,W,80);/* earth */cx.fillStyle='#1a5c2a';cx.fillRect(0,HH-40,W,40);cx.fillStyle='#22c55e';cx.font='11px sans-serif';cx.fillText('🌍 Tierra',W/2-30,HH-10);/* muon */const muY=30+progress*(HH-80);cx.beginPath();cx.arc(W/2,muY,6,0,Math.PI*2);cx.fillStyle='#f59e0b';cx.fill();cx.strokeStyle='#fff';cx.lineWidth=1.5;cx.stroke();if(progress<.05){cx.fillStyle='rgba(245,158,11,.4)';cx.beginPath();cx.arc(W/2,muY,20-progress*300,0,Math.PI*2);cx.fill()}cx.fillStyle='#f59e0b';cx.font='bold 11px sans-serif';cx.fillText('μ',W/2-4,muY+4);/* trail */cx.strokeStyle='rgba(245,158,11,.3)';cx.lineWidth=1;cx.setLineDash([3,3]);cx.beginPath();cx.moveTo(W/2,30);cx.lineTo(W/2,muY);cx.stroke();cx.setLineDash([]);/* clock */cx.fillStyle='#fff';cx.font='bold 16px monospace';cx.textAlign='center';cx.fillText('⏱ '+tObs+' μs',W/2,HH-55);cx.textAlign='left';
/* Muon frame */const cm=document.getElementById('muMuon');if(!cm)return;const mx=cm.getContext('2d');mx.clearRect(0,0,W,HH);mx.fillStyle='#0a0e2a';mx.fillRect(0,0,W,HH);/* contracted distance */const earthY=30+(progress)*(HH-80);/* earth coming up */mx.fillStyle='#1a5c2a';mx.fillRect(0,earthY+20,W,HH);mx.fillStyle='#22c55e';mx.font='11px sans-serif';mx.fillText('🌍',W/2-10,earthY+35);/* muon stays centered */mx.beginPath();mx.arc(W/2,60,8,0,Math.PI*2);mx.fillStyle='#f59e0b';mx.fill();mx.strokeStyle='#fff';mx.lineWidth=1.5;mx.stroke();mx.fillStyle='#f59e0b';mx.font='bold 12px sans-serif';mx.fillText('μ',W/2-5,64);/* arm+watch */mx.strokeStyle='#e2e8f0';mx.lineWidth=2;mx.beginPath();mx.moveTo(W/2+8,60);mx.lineTo(W/2+35,75);mx.stroke();mx.beginPath();mx.arc(W/2+38,78,12,0,Math.PI*2);mx.fillStyle='#111';mx.fill();mx.strokeStyle='#f59e0b';mx.lineWidth=1.5;mx.stroke();mx.fillStyle='#f59e0b';mx.font='bold 8px monospace';mx.textAlign='center';mx.fillText(tProp,W/2+38,81);mx.textAlign='left';/* label */mx.fillStyle='rgba(245,158,11,.5)';mx.font='10px sans-serif';mx.fillText('Distancia contraída: '+(H0/g/1000).toFixed(1)+' km',10,HH-10)}
/* ===== BARN-POLE PARADOX ===== */
let barnAnim=null,barnTime=0,barnRun=true;
function buildBarn(m){m.innerHTML=`<div class="sim-card" style="grid-column:1/-1"><div class="card-head"><div class="num">5</div><div><h3>Paradoja de la lanza y el granero</h3><small>¿Puede la lanza pasar por el granero?</small></div></div><div class="card-body"><div class="dual-view"><div style="text-align:center"><div style="color:var(--muted);font-size:11px;font-weight:700;margin-bottom:4px">Marco del granero (tierra)</div><canvas id="barnEarth" width="340" height="260"></canvas></div><div style="text-align:center"><div style="color:var(--muted);font-size:11px;font-weight:700;margin-bottom:4px">Marco del corredor</div><canvas id="barnRunner" width="340" height="260"></canvas></div></div><div style="display:flex;gap:16px;justify-content:center;margin-top:10px;flex-wrap:wrap"><div class="readout"><span>Longitud lanza (L₀)</span><strong id="barnL0">10.0 m</strong></div><div class="readout"><span>Apertura granero</span><strong id="barnG">8.0 m</strong></div><div class="readout"><span>Lanza contraída</span><strong id="barnLC">0.0 m</strong></div><div class="readout"><span>Granero contraído</span><strong id="barnGC">0.0 m</strong></div></div></div><div class="card-controls"><button onclick="barnRun=!barnRun;this.textContent=barnRun?'⏸':'▶';if(barnRun)barnAnim=requestAnimationFrame(barnLoop)" style="background:var(--accent);color:#fff;border:none;padding:6px 16px;border-radius:8px;font-weight:700;cursor:pointer">⏸</button><label>Velocidad v</label><input type="range" id="barnV" min="10" max="99" value="80" oninput="barnUpd()"><span class="val" id="barnVd">0.80 c</span><label>Long. lanza</label><input type="range" id="barnLP" min="5" max="20" value="10" oninput="barnUpd()"><label>Granero</label><input type="range" id="barnGP" min="4" max="15" value="8" oninput="barnUpd()"></div></div>`;barnUpd();barnRun=true;barnAnim=requestAnimationFrame(barnLoop)}
function barnUpd(){const v=document.getElementById('barnV').value/100,g=gamma(v),L0=+document.getElementById('barnLP').value,G0=+document.getElementById('barnGP').value;document.getElementById('barnVd').textContent=v.toFixed(2)+' c';document.getElementById('barnL0').textContent=L0.toFixed(1)+' m';document.getElementById('barnG').textContent=G0.toFixed(1)+' m';document.getElementById('barnLC').textContent=(L0/g).toFixed(1)+' m';document.getElementById('barnGC').textContent=(G0/g).toFixed(1)+' m'}
function barnLoop(){if(!barnRun){barnAnim=null;return}barnTime+=.025;barnDraw();barnAnim=requestAnimationFrame(barnLoop)}
function barnDraw(){const v=document.getElementById('barnV').value/100,g=gamma(v),L0=+document.getElementById('barnLP').value,G0=+document.getElementById('barnGP').value;const sc=12;
/* Earth frame: barn static, lance contracted */const c1=document.getElementById('barnEarth');if(!c1)return;const x1=c1.getContext('2d'),W=c1.width,H=c1.height;x1.clearRect(0,0,W,H);x1.fillStyle='#0d1424';x1.fillRect(0,0,W,H);const bx=W/2,bw=G0*sc,bh=100;/* barn */x1.fillStyle='rgba(139,92,42,.3)';x1.fillRect(bx-bw/2,H/2-bh/2,bw,bh);x1.strokeStyle='#8b5c2a';x1.lineWidth=2;x1.strokeRect(bx-bw/2,H/2-bh/2,bw,bh);/* doors */x1.fillStyle='rgba(139,69,19,.6)';x1.fillRect(bx-bw/2-4,H/2-bh/2,8,bh);x1.fillRect(bx+bw/2-4,H/2-bh/2,8,bh);x1.fillStyle='#8b5c2a';x1.font='bold 11px sans-serif';x1.fillText('Granero',bx-22,H/2-bh/2-8);/* runner with contracted lance */const lw=L0/g*sc,runX=((barnTime*v*100)%(W+lw+100))-lw-50;x1.fillStyle='#e2e8f0';x1.font='20px sans-serif';x1.fillText('🏃',runX+lw-15,H/2+5);x1.strokeStyle='#ef4444';x1.lineWidth=3;x1.beginPath();x1.moveTo(runX,H/2);x1.lineTo(runX+lw,H/2);x1.stroke();/* label */const fits=lw<bw;x1.fillStyle=fits?'#22c55e':'#ef4444';x1.font='bold 11px sans-serif';x1.fillText(fits?'✓ ¡Cabe!':'✗ No cabe',10,20);
/* Runner frame: lance proper, barn contracted */const c2=document.getElementById('barnRunner');if(!c2)return;const x2=c2.getContext('2d');x2.clearRect(0,0,W,H);x2.fillStyle='#0d1424';x2.fillRect(0,0,W,H);const bgw=G0/g*sc;/* runner stays center */const rx=W/2;x2.fillStyle='#e2e8f0';x2.font='20px sans-serif';x2.fillText('🏃',rx-15,H/2+5);/* lance at proper length */const plw=L0*sc;x2.strokeStyle='#ef4444';x2.lineWidth=3;x2.beginPath();x2.moveTo(rx-plw+15,H/2);x2.lineTo(rx+15,H/2);x2.stroke();/* barn moving left, contracted */const barnMoveX=W+50-((barnTime*v*100)%(W+bgw+200));x2.fillStyle='rgba(139,92,42,.3)';x2.fillRect(barnMoveX-bgw/2,H/2-bh/2,bgw,bh);x2.strokeStyle='#8b5c2a';x2.lineWidth=2;x2.strokeRect(barnMoveX-bgw/2,H/2-bh/2,bgw,bh);x2.fillStyle='rgba(139,69,19,.6)';x2.fillRect(barnMoveX-bgw/2-4,H/2-bh/2,8,bh);x2.fillRect(barnMoveX+bgw/2-4,H/2-bh/2,8,bh);const fits2=plw>bgw;x2.fillStyle=fits2?'#ef4444':'#22c55e';x2.font='bold 11px sans-serif';x2.fillText(fits2?'✗ No cabe':'✓ Cabe',10,20)}
/* ===== MORE SR EXPERIMENTS ===== */
function buildMoreSR(m){m.innerHTML=`<div class="sim-card" style="grid-column:1/-1"><div class="card-head"><div class="num">6</div><div><h3>Más experimentos</h3><small>Suma de velocidades, E=mc², Doppler relativista.</small></div></div><div class="card-body" style="padding:16px">
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
<div style="background:#0d1424;border-radius:8px;padding:14px;border:1px solid var(--border)"><h4 style="font-size:13px;margin-bottom:10px">🚀 Suma de velocidades</h4><div style="font-size:11px;color:var(--muted);margin-bottom:8px">Clásica: u+v &nbsp;|&nbsp; Relativista: (u+v)/(1+uv/c²)</div><label style="font-size:11px;color:var(--muted)">u =</label><input type="range" id="addU" min="0" max="99" value="50" oninput="updateAdd()" style="width:100%"><div style="display:flex;justify-content:space-between;font-size:11px"><span class="val" id="addUd">0.50 c</span></div><label style="font-size:11px;color:var(--muted)">v =</label><input type="range" id="addV" min="0" max="99" value="70" oninput="updateAdd()" style="width:100%"><div style="display:flex;justify-content:space-between;font-size:11px"><span class="val" id="addVd">0.70 c</span></div><hr style="border-color:var(--border);margin:8px 0"><div style="font-size:12px"><span style="color:var(--muted)">Clásica:</span> <strong id="addClass" style="color:#ef4444">1.20 c ✗</strong></div><div style="font-size:12px;margin-top:4px"><span style="color:var(--muted)">Relativista:</span> <strong id="addRel" style="color:#22c55e">0.89 c ✓</strong></div></div>
<div style="background:#0d1424;border-radius:8px;padding:14px;border:1px solid var(--border)"><h4 style="font-size:13px;margin-bottom:10px">⚡ E = mc²</h4><div style="font-size:11px;color:var(--muted);margin-bottom:8px">¿Cuánta energía contiene una masa?</div><label style="font-size:11px;color:var(--muted)">Masa (kg)</label><input type="range" id="emcM" min="1" max="100" value="1" oninput="updateEmc()" style="width:100%"><span class="val" id="emcMd" style="font-size:11px">1 kg</span><hr style="border-color:var(--border);margin:8px 0"><div style="font-size:12px"><span style="color:var(--muted)">Energía:</span></div><div style="font-size:18px;font-weight:800;color:var(--accent);margin-top:4px" id="emcE">9.0 × 10¹⁶ J</div><div style="font-size:11px;color:var(--muted);margin-top:6px" id="emcComp">≈ 21.5 kilotones de TNT</div></div>
<div style="background:#0d1424;border-radius:8px;padding:14px;border:1px solid var(--border)"><h4 style="font-size:13px;margin-bottom:10px">🌈 Doppler relativista</h4><div style="font-size:11px;color:var(--muted);margin-bottom:8px">Desplazamiento al rojo/azul de la luz</div><label style="font-size:11px;color:var(--muted)">Velocidad (+ = alejar)</label><input type="range" id="dopV" min="-95" max="95" value="50" oninput="updateDop()" style="width:100%"><span class="val" id="dopVd" style="font-size:11px">0.50 c</span><hr style="border-color:var(--border);margin:8px 0"><canvas id="dopCv" width="200" height="60" style="width:100%;border-radius:6px"></canvas><div style="font-size:12px;margin-top:6px"><span style="color:var(--muted)">λ₀ = 550 nm →</span> <strong id="dopLam" style="color:#f59e0b">λ = 957 nm</strong></div><div style="font-size:11px;color:var(--muted);margin-top:2px" id="dopShift">Desplazamiento al rojo (infrarrojo)</div></div>
</div></div></div>`;updateAdd();updateEmc();updateDop()}
function updateAdd(){const u=document.getElementById('addU').value/100,v=document.getElementById('addV').value/100;document.getElementById('addUd').textContent=u.toFixed(2)+' c';document.getElementById('addVd').textContent=v.toFixed(2)+' c';const cl=u+v,rel=(u+v)/(1+u*v);document.getElementById('addClass').textContent=cl.toFixed(2)+' c '+(cl>1?'✗ ¡Supera c!':'');document.getElementById('addClass').style.color=cl>1?'#ef4444':'#22c55e';document.getElementById('addRel').textContent=rel.toFixed(4)+' c ✓';document.getElementById('addRel').style.color='#22c55e'}
function updateEmc(){const m=+document.getElementById('emcM').value;document.getElementById('emcMd').textContent=m+' kg';const E=m*299792458*299792458;const exp=Math.floor(Math.log10(E));const man=(E/Math.pow(10,exp)).toFixed(1);document.getElementById('emcE').textContent=`${man} × 10^${exp} J`;const kt=E/(4.184e12);document.getElementById('emcComp').textContent=kt>1e6?`≈ ${(kt/1e6).toFixed(1)} megatones de TNT`:`≈ ${kt.toFixed(1)} kilotones de TNT`}
function updateDop(){const v=document.getElementById('dopV').value/100;document.getElementById('dopVd').textContent=(v>=0?'+':'')+v.toFixed(2)+' c';const lam0=550;const lamObs=lam0*Math.sqrt((1+v)/(1-v+0.001));document.getElementById('dopLam').textContent='λ = '+lamObs.toFixed(0)+' nm';document.getElementById('dopShift').textContent=v>0?'Desplazamiento al rojo'+(lamObs>700?' (infrarrojo)':''):v<0?'Desplazamiento al azul'+(lamObs<400?' (ultravioleta)':''):'Sin desplazamiento';/* draw spectrum bar */const cv=document.getElementById('dopCv');if(!cv)return;const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);for(let x=0;x<W;x++){const l=380+(x/W)*400;ctx.fillStyle=wavToCSS(l);ctx.fillRect(x,0,1,H)}/* marker */const mx=(Math.min(Math.max(lamObs,380),780)-380)/400*W;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(mx,0);ctx.lineTo(mx,H);ctx.stroke()}
function wavToCSS(l){let r=0,g=0,b=0;if(l>=380&&l<440){r=(440-l)/60;b=1}else if(l>=440&&l<490){g=(l-440)/50;b=1}else if(l>=490&&l<510){g=1;b=(510-l)/20}else if(l>=510&&l<580){r=(l-510)/70;g=1}else if(l>=580&&l<645){r=1;g=(645-l)/65}else if(l>=645&&l<=780){r=1}let f=1;if(l>=380&&l<420)f=0.3+0.7*(l-380)/40;else if(l>700)f=0.3+0.7*(780-l)/80;return `rgb(${Math.floor(r*f*255)},${Math.floor(g*f*255)},${Math.floor(b*f*255)})`}
/* ===== ELEVATOR ===== */
let elevAnim=null,elevTime=0,elevRun=true;
function buildElevator(m){m.innerHTML=`<div class="sim-card" style="grid-column:1/-1"><div class="card-head"><div class="num">1</div><div><h3>Ascensor de Einstein</h3><small>La luz se curva en un campo gravitatorio (equivalencia).</small></div></div><div class="card-body"><canvas id="elevCv" width="700" height="380"></canvas><div style="text-align:center;margin-top:8px;color:var(--muted);font-size:12px">En un ascensor acelerado, la luz sigue una trayectoria curva, indistinguible de efectos gravitatorios.</div></div><div class="card-controls"><button onclick="elevRun=!elevRun;this.textContent=elevRun?'⏸':'▶';if(elevRun)elevAnim=requestAnimationFrame(elevLoop)" style="background:var(--accent);color:#fff;border:none;padding:6px 16px;border-radius:8px;font-weight:700;cursor:pointer">⏸</button><label>Aceleración</label><input type="range" id="elevA" min="1" max="30" value="10" oninput="document.getElementById('elevAd').textContent=this.value+' m/s²'"><span class="val" id="elevAd">10 m/s²</span><button onclick="elevTime=0" style="background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;font-weight:700;cursor:pointer">↻</button></div></div>`;elevTime=0;elevRun=true;elevAnim=requestAnimationFrame(elevLoop)}
function elevLoop(){if(!elevRun){elevAnim=null;return}elevTime+=.02;elevDraw();elevAnim=requestAnimationFrame(elevLoop)}
function elevDraw(){const cv=document.getElementById('elevCv');if(!cv)return;const ctx=cv.getContext('2d'),W=cv.width,H=cv.height,a=+document.getElementById('elevA').value;ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1424';ctx.fillRect(0,0,W,H);
const ew=220,eh=280,ex=(W/2-ew/2)-60,ey=(H-eh)/2;/* elevator box */ctx.strokeStyle='#475569';ctx.lineWidth=3;ctx.strokeRect(ex,ey,ew,eh);ctx.fillStyle='rgba(30,40,60,.6)';ctx.fillRect(ex,ey,ew,eh);/* arrow up */ctx.fillStyle='#3b82f6';ctx.font='bold 14px sans-serif';ctx.fillText('a = '+a+' m/s²',ex+ew/2-50,ey-15);ctx.strokeStyle='#3b82f6';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ex+ew/2,ey+eh+5);ctx.lineTo(ex+ew/2,ey+eh+35);ctx.stroke();ctx.beginPath();ctx.moveTo(ex+ew/2-8,ey+eh+15);ctx.lineTo(ex+ew/2,ey+eh+5);ctx.lineTo(ex+ew/2+8,ey+eh+15);ctx.fill();
/* person inside */ctx.font='40px sans-serif';ctx.fillText('🧑‍🚀',ex+ew/2-20,ey+eh-40);
/* light beam - enters from left, curves down due to acceleration */const lightY0=ey+eh*0.35;ctx.strokeStyle='#f59e0b';ctx.lineWidth=2.5;ctx.beginPath();const steps=60;for(let i=0;i<=steps;i++){const t=i/steps;const lx=ex+t*ew;const curve=0.5*a*0.08*(t*t);const ly=lightY0+curve*12;if(i===0)ctx.moveTo(lx,ly);else ctx.lineTo(lx,ly)}ctx.stroke();/* photon */const pt=(elevTime*0.7)%1;const px=ex+pt*ew;const pcurve=0.5*a*0.08*(pt*pt);const py=lightY0+pcurve*12;ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fillStyle='#f59e0b';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();
/* explanation panel */ctx.fillStyle='rgba(26,34,54,.9)';ctx.fillRect(W/2+60,ey,260,eh);ctx.strokeStyle='var(--border)';ctx.lineWidth=1;ctx.strokeRect(W/2+60,ey,260,eh);ctx.fillStyle='#e2e8f0';ctx.font='bold 14px sans-serif';ctx.fillText('Principio de equivalencia',W/2+75,ey+30);ctx.font='12px sans-serif';ctx.fillStyle='#94a3b8';const lines=['','Un observador en un ascensor','acelerado NO puede distinguir','entre:','','  • Aceleración hacia arriba','  • Campo gravitatorio hacia abajo','','La luz, que viaja en línea','recta en el espacio, parece','curvarse dentro del ascensor.','','→ La gravedad curva la luz.'];lines.forEach((l,i)=>ctx.fillText(l,W/2+75,ey+55+i*18))}
/* ===== TOWER CLOCK ===== */
let twTime=0,twAnim=null,twRun=true;
function buildTower(m){m.innerHTML=`<div class="sim-card" style="grid-column:1/-1"><div class="card-head"><div class="num">2</div><div><h3>Reloj en torre gravitatoria</h3><small>Dilatación temporal gravitatoria — los relojes van más lentos cerca de la masa.</small></div></div><div class="card-body"><canvas id="twCv" width="700" height="380"></canvas><div style="display:flex;gap:16px;justify-content:center;margin-top:10px;flex-wrap:wrap"><div class="readout"><span>Reloj en Tierra</span><strong id="twBot">12:00:00.00</strong></div><div class="readout"><span>Reloj en altura</span><strong id="twTop">12:00:00.00</strong></div><div class="readout" style="background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3)"><span>Diferencia acumulada</span><strong id="twDiff" style="color:#f59e0b">0.000 s</strong></div></div></div><div class="card-controls"><button onclick="twRun=!twRun;this.textContent=twRun?'⏸':'▶';if(twRun)twAnim=requestAnimationFrame(twLoop)" style="background:var(--accent);color:#fff;border:none;padding:6px 16px;border-radius:8px;font-weight:700;cursor:pointer">⏸</button><label>Masa (M☉)</label><input type="range" id="twM" min="1" max="100" value="10" oninput="document.getElementById('twMd').textContent=this.value/10"><span class="val" id="twMd">1</span><label>Altura (km)</label><input type="range" id="twH" min="1" max="1000" value="100" oninput="document.getElementById('twHd').textContent=this.value*10"><span class="val" id="twHd">1000</span><label>Escala temporal</label><input type="range" id="twSc" min="1" max="20" value="1" oninput="document.getElementById('twScd').textContent=this.value+'x'"><span class="val" id="twScd">1x</span><button onclick="twTime=0" style="background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;font-weight:700;cursor:pointer">↻</button></div></div>`;twTime=0;twRun=true;twAnim=requestAnimationFrame(twLoop)}
function twLoop(){if(!twRun){twAnim=null;return}const sc=+document.getElementById('twSc').value;twTime+=0.016*sc;twDrawTower();twAnim=requestAnimationFrame(twLoop)}
function fmtTime(s){const h=Math.floor(s/3600)%24,m=Math.floor(s/60)%60,ss=s%60;return `${(12+h).toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${ss.toFixed(2).padStart(5,'0')}`}
function twDrawTower(){const cv=document.getElementById('twCv');if(!cv)return;const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;const M=document.getElementById('twM').value/10,hKm=document.getElementById('twH').value*10;const R=6371e3,GM=6.674e-11*M*5.972e24;ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1424';ctx.fillRect(0,0,W,H);
/* tower */const towerX=W/2-30,towerW=60,groundY=H-50;const hPx=Math.min(hKm/50000*250,280);ctx.fillStyle='rgba(100,116,139,.2)';ctx.fillRect(towerX,groundY-hPx,towerW,hPx);ctx.strokeStyle='#64748b';ctx.lineWidth=2;ctx.strokeRect(towerX,groundY-hPx,towerW,hPx);/* ground */ctx.fillStyle='#1a3a1a';ctx.fillRect(0,groundY,W,H-groundY);/* height label */ctx.fillStyle='#94a3b8';ctx.font='11px sans-serif';ctx.save();ctx.translate(towerX-15,groundY-hPx/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText('h = '+(hKm>=1000?(hKm/1000).toFixed(0)+' Mm':hKm+' km'),0,0);ctx.restore();
/* bottom clock */const tBot=twTime;ctx.fillStyle='#111';ctx.beginPath();ctx.arc(towerX+towerW/2,groundY-15,18,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3b82f6';ctx.lineWidth=2;ctx.stroke();const aBot=(tBot%60)/60*Math.PI*2-Math.PI/2;ctx.strokeStyle='#3b82f6';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(towerX+towerW/2,groundY-15);ctx.lineTo(towerX+towerW/2+Math.cos(aBot)*12,groundY-15+Math.sin(aBot)*12);ctx.stroke();
/* top clock - runs faster */const dtFrac=GM/(R*9e16)-GM/((R+hKm*1000)*9e16);const tTop=twTime*(1+dtFrac*1e12);ctx.fillStyle='#111';ctx.beginPath();ctx.arc(towerX+towerW/2,groundY-hPx+15,18,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f59e0b';ctx.lineWidth=2;ctx.stroke();const aTop=(tTop%60)/60*Math.PI*2-Math.PI/2;ctx.strokeStyle='#f59e0b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(towerX+towerW/2,groundY-hPx+15);ctx.lineTo(towerX+towerW/2+Math.cos(aTop)*12,groundY-hPx+15+Math.sin(aTop)*12);ctx.stroke();
/* readouts */document.getElementById('twBot').textContent=fmtTime(tBot);document.getElementById('twTop').textContent=fmtTime(tTop);document.getElementById('twDiff').textContent=(tTop-tBot).toFixed(6)+' s';
/* labels */ctx.fillStyle='#3b82f6';ctx.font='bold 11px sans-serif';ctx.fillText('Reloj Tierra',towerX-50,groundY-5);ctx.fillStyle='#f59e0b';ctx.fillText('Reloj altura',towerX-50,groundY-hPx+10)}
/* ===== HORIZON ===== */
let hzAnim=null,hzTime=0,hzRun=true;
function buildHorizon(m){m.innerHTML=`<div class="sim-card" style="grid-column:1/-1"><div class="card-head"><div class="num">3</div><div><h3>Horizonte de sucesos</h3><small>¿Qué ocurre al cruzar el horizonte de un agujero negro?</small></div></div><div class="card-body"><div class="dual-view"><div style="text-align:center"><div style="color:var(--muted);font-size:11px;font-weight:700;margin-bottom:4px">Desde la persona que cae</div><canvas id="hzFall" width="340" height="300"></canvas></div><div style="text-align:center"><div style="color:var(--muted);font-size:11px;font-weight:700;margin-bottom:4px">Desde el observador externo</div><canvas id="hzExt" width="340" height="300"></canvas></div></div><div style="text-align:center;margin-top:8px;color:var(--muted);font-size:11px"><b>Izquierda:</b> Nada especial al cruzar el horizonte. Se siente normal. &nbsp; <b>Derecha:</b> La persona parece congelarse y atenuarse al acercarse.</div></div><div class="card-controls"><button onclick="hzRun=!hzRun;this.textContent=hzRun?'⏸':'▶';if(hzRun)hzAnim=requestAnimationFrame(hzLoop)" style="background:var(--accent);color:#fff;border:none;padding:6px 16px;border-radius:8px;font-weight:700;cursor:pointer">⏸</button><label>Masa agujero negro</label><input type="range" id="hzM" min="1" max="100" value="10" oninput="document.getElementById('hzMd').textContent=this.value+' M☉'"><span class="val" id="hzMd">10 M☉</span><button onclick="hzTime=0" style="background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;font-weight:700;cursor:pointer">↻</button></div></div>`;hzTime=0;hzRun=true;hzAnim=requestAnimationFrame(hzLoop)}
function hzLoop(){if(!hzRun){hzAnim=null;return}hzTime+=.012;hzDraw();hzAnim=requestAnimationFrame(hzLoop)}
function hzDraw(){const W=340,H=300;/* Faller view */const c1=document.getElementById('hzFall');if(!c1)return;const x1=c1.getContext('2d');x1.clearRect(0,0,W,H);x1.fillStyle='#050510';x1.fillRect(0,0,W,H);/* stars */for(let i=0;i<30;i++){x1.fillStyle=`rgba(255,255,255,${.3+Math.sin(i+hzTime)*.2})`;x1.fillRect(20+((i*73)%300),10+((i*47)%280),1.5,1.5)}/* horizon line */const hLine=H*0.6+Math.sin(hzTime*0.5)*5;x1.strokeStyle='rgba(99,102,241,.3)';x1.lineWidth=1;x1.setLineDash([4,4]);x1.beginPath();x1.moveTo(0,hLine);x1.lineTo(W,hLine);x1.stroke();x1.setLineDash([]);x1.fillStyle='rgba(99,102,241,.5)';x1.font='10px sans-serif';x1.fillText('Horizonte de sucesos',W/2-55,hLine-5);/* person */const py=30+hzTime*15;x1.font='28px sans-serif';x1.fillText('🧑‍🚀',W/2-14,Math.min(py,H-20));x1.fillStyle='#22c55e';x1.font='bold 11px sans-serif';x1.fillText(py<hLine?'Cayendo... todo normal':'Cruzó el horizonte. Nada cambió.',10,H-10);
/* External view */const c2=document.getElementById('hzExt');if(!c2)return;const x2=c2.getContext('2d');x2.clearRect(0,0,W,H);x2.fillStyle='#050510';x2.fillRect(0,0,W,H);/* BH */const bhR=50;x2.beginPath();x2.arc(W/2,H/2+30,bhR,0,Math.PI*2);x2.fillStyle='#000';x2.fill();x2.strokeStyle='rgba(99,102,241,.4)';x2.lineWidth=2;x2.stroke();/* accretion glow */const grd=x2.createRadialGradient(W/2,H/2+30,bhR,W/2,H/2+30,bhR+40);grd.addColorStop(0,'rgba(245,158,11,.15)');grd.addColorStop(1,'transparent');x2.fillStyle=grd;x2.beginPath();x2.arc(W/2,H/2+30,bhR+40,0,Math.PI*2);x2.fill();/* person approaching - slows and redshifts */const approach=Math.min(hzTime*8,bhR-5);const dist=bhR+60-approach;const alpha=Math.max(0.05,1-approach/(bhR+20));const redshift=Math.min(1,approach/(bhR));x2.globalAlpha=alpha;const r=Math.floor(230+redshift*25),g2=Math.floor(230*(1-redshift)),b=Math.floor(240*(1-redshift));x2.fillStyle=`rgb(${r},${g2},${b})`;x2.font='24px sans-serif';x2.fillText('🧑‍🚀',W/2-12,H/2+30-dist);x2.globalAlpha=1;x2.fillStyle='#f59e0b';x2.font='bold 11px sans-serif';x2.fillText(approach<bhR-10?'Se acerca...':'Parece congelarse y enrojecerse',10,H-10)}
/* ===== LENSING ===== */
let lensStars=[],lensBH={x:350,y:200},lensDrag=false;
function buildLensing(m){m.innerHTML=`<div class="sim-card" style="grid-column:1/-1"><div class="card-head"><div class="num">4</div><div><h3>Lente gravitacional</h3><small>La gravedad curva la luz de estrellas lejanas.</small></div></div><div class="card-body"><canvas id="lensCv" width="700" height="400" style="cursor:grab"></canvas><div style="text-align:center;color:var(--muted);font-size:11px;margin-top:6px">Arrastra el agujero negro (círculo oscuro) para ver la distorsión.</div></div><div class="card-controls"><label>Masa del lente</label><input type="range" id="lensM" min="1" max="100" value="30" oninput="lensDraw()"><span class="val" id="lensMd">30</span><label>Intensidad</label><input type="range" id="lensI" min="10" max="100" value="75" oninput="lensDraw()"><span class="val" id="lensId">75%</span></div></div>`;lensStars=[];for(let i=0;i<60;i++)lensStars.push({x:Math.random()*700,y:Math.random()*400,r:1+Math.random()*2,b:0.5+Math.random()*0.5});lensBH={x:350,y:200};const cv=document.getElementById('lensCv');cv.addEventListener('mousedown',e=>{const r=cv.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;if(Math.hypot(mx-lensBH.x,my-lensBH.y)<40)lensDrag=true});cv.addEventListener('mousemove',e=>{if(!lensDrag)return;const r=cv.getBoundingClientRect();lensBH.x=e.clientX-r.left;lensBH.y=e.clientY-r.top;lensDraw()});cv.addEventListener('mouseup',()=>lensDrag=false);cv.addEventListener('mouseleave',()=>lensDrag=false);lensDraw()}
function lensDraw(){const cv=document.getElementById('lensCv');if(!cv)return;const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;const mass=+document.getElementById('lensM').value,intensity=document.getElementById('lensI').value/100;document.getElementById('lensMd').textContent=mass;document.getElementById('lensId').textContent=Math.round(intensity*100)+'%';ctx.clearRect(0,0,W,H);ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);/* draw lensed stars */lensStars.forEach(s=>{const dx=s.x-lensBH.x,dy=s.y-lensBH.y,d=Math.hypot(dx,dy);const einsteinR=mass*2;if(d<5)return;const deflection=einsteinR*einsteinR/d*intensity;const angle=Math.atan2(dy,dx);const lx=s.x+Math.cos(angle)*deflection,ly=s.y+Math.sin(angle)*deflection;const amplification=Math.min(3,1+einsteinR*einsteinR/(d*d)*4);ctx.beginPath();ctx.arc(lx,ly,s.r*amplification,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,${200+Math.floor(s.b*55)},${Math.min(1,s.b*amplification)})`;ctx.fill();/* Einstein ring effect */if(d<einsteinR*2&&d>einsteinR*0.5){ctx.strokeStyle=`rgba(200,220,255,${0.15*(1-d/(einsteinR*2))})`;ctx.lineWidth=0.5;ctx.stroke()}});/* BH */ctx.beginPath();ctx.arc(lensBH.x,lensBH.y,15,0,Math.PI*2);ctx.fillStyle='#000';ctx.fill();const grd=ctx.createRadialGradient(lensBH.x,lensBH.y,15,lensBH.x,lensBH.y,15+mass);grd.addColorStop(0,'rgba(99,102,241,.2)');grd.addColorStop(1,'transparent');ctx.fillStyle=grd;ctx.beginPath();ctx.arc(lensBH.x,lensBH.y,15+mass,0,Math.PI*2);ctx.fill();/* Einstein ring */ctx.strokeStyle='rgba(200,220,255,.15)';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(lensBH.x,lensBH.y,mass*2,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}
/* ===== SPAGHETTIFICATION ===== */
function buildSpaghetti(m){m.innerHTML=`<div class="sim-card" style="grid-column:1/-1"><div class="card-head"><div class="num">5</div><div><h3>Espaguetización</h3><small>Las fuerzas de marea estiran el cuerpo radialmente y lo comprimen lateralmente.</small></div></div><div class="card-body"><canvas id="spagCv" width="700" height="380"></canvas><div style="display:flex;gap:16px;justify-content:center;margin-top:10px"><div class="readout"><span>Estiramiento (radial)</span><strong id="spagR">1.0x</strong></div><div class="readout"><span>Compresión (lateral)</span><strong id="spagL">1.0x</strong></div></div></div><div class="card-controls"><label>Masa agujero negro (M☉)</label><input type="range" id="spagM" min="1" max="100" value="10" oninput="spagDraw()"><span class="val" id="spagMd">10</span><label>Distancia al centro (rₛ)</label><input type="range" id="spagD" min="15" max="200" value="100" oninput="spagDraw()"><span class="val" id="spagDd">100</span></div></div>`;spagDraw()}
function spagDraw(){const cv=document.getElementById('spagCv');if(!cv)return;const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;const M=+document.getElementById('spagM').value,dist=+document.getElementById('spagD').value;document.getElementById('spagMd').textContent=M;document.getElementById('spagDd').textContent=dist;const tidal=M*100/(dist*dist*dist)*5000;const stretchY=1+Math.min(tidal,8);const compressX=Math.max(0.1,1/(1+tidal*0.3));document.getElementById('spagR').textContent=stretchY.toFixed(1)+'x';document.getElementById('spagL').textContent=compressX.toFixed(2)+'x';ctx.clearRect(0,0,W,H);ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
/* BH on left */ctx.beginPath();ctx.arc(80,H/2,40,0,Math.PI*2);ctx.fillStyle='#000';ctx.fill();ctx.strokeStyle='rgba(99,102,241,.3)';ctx.lineWidth=2;ctx.stroke();const grd=ctx.createRadialGradient(80,H/2,40,80,H/2,100);grd.addColorStop(0,'rgba(245,158,11,.15)');grd.addColorStop(1,'transparent');ctx.fillStyle=grd;ctx.beginPath();ctx.arc(80,H/2,100,0,Math.PI*2);ctx.fill();ctx.fillStyle='#94a3b8';ctx.font='10px sans-serif';ctx.fillText('Agujero negro',45,H/2+55);
/* stick figure - stretched and compressed */const fx=350,fy=H/2;ctx.save();ctx.translate(fx,fy);/* body */const headR=12*compressX;const bodyH=50*stretchY;const armW=25*compressX;const legW=15*compressX;ctx.strokeStyle='#e2e8f0';ctx.lineWidth=Math.max(1,3*compressX);/* head */ctx.beginPath();ctx.ellipse(0,-bodyH/2-headR,headR,headR*stretchY/2,0,0,Math.PI*2);ctx.stroke();/* body */ctx.beginPath();ctx.moveTo(0,-bodyH/2);ctx.lineTo(0,bodyH/2);ctx.stroke();/* arms */ctx.beginPath();ctx.moveTo(-armW,-bodyH/4);ctx.lineTo(0,-bodyH/6);ctx.lineTo(armW,-bodyH/4);ctx.stroke();/* legs */ctx.beginPath();ctx.moveTo(-legW,bodyH/2+20*stretchY);ctx.lineTo(0,bodyH/2);ctx.lineTo(legW,bodyH/2+20*stretchY);ctx.stroke();ctx.restore();
/* force arrows */ctx.strokeStyle='#ef4444';ctx.lineWidth=2;const arrowLen=Math.min(tidal*15,120);/* up arrow */ctx.beginPath();ctx.moveTo(fx,fy-bodyH/2-headR*2-5);ctx.lineTo(fx,fy-bodyH/2-headR*2-5-arrowLen);ctx.stroke();ctx.fillStyle='#ef4444';ctx.beginPath();ctx.moveTo(fx-5,fy-bodyH/2-headR*2-arrowLen);ctx.lineTo(fx,fy-bodyH/2-headR*2-5-arrowLen-8);ctx.lineTo(fx+5,fy-bodyH/2-headR*2-arrowLen);ctx.fill();/* down */ctx.beginPath();ctx.moveTo(fx,fy+bodyH/2+25*stretchY);ctx.lineTo(fx,fy+bodyH/2+25*stretchY+arrowLen);ctx.stroke();ctx.beginPath();ctx.moveTo(fx-5,fy+bodyH/2+25*stretchY+arrowLen);ctx.lineTo(fx,fy+bodyH/2+25*stretchY+arrowLen+8);ctx.lineTo(fx+5,fy+bodyH/2+25*stretchY+arrowLen);ctx.fill();/* lateral compress arrows */ctx.strokeStyle='#3b82f6';ctx.beginPath();ctx.moveTo(fx-armW-40,fy);ctx.lineTo(fx-armW-10,fy);ctx.stroke();ctx.beginPath();ctx.moveTo(fx+armW+40,fy);ctx.lineTo(fx+armW+10,fy);ctx.stroke();
/* labels */ctx.fillStyle='#ef4444';ctx.font='bold 11px sans-serif';ctx.fillText('Estiramiento radial',fx+80,fy-40);ctx.fillStyle='#3b82f6';ctx.fillText('Compresión lateral',fx+80,fy+10)}
/* INIT */
setMode('special');navTo('two-obs');
</script></body></html>
