<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Efecto fotoelectrico | Physics</title><style>:root{--ink:#17202f;--muted:#607083;--paper:#f7f9fb;--panel:#fff;--line:#d9e2ec;--blue:#0b63ce;--teal:#087f8c;--gold:#d89818;--red:#d64545;--green:#14845f}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}header{padding:20px 24px;border-bottom:1px solid var(--line);background:#fff}h1{margin:0 0 6px;font-size:clamp(1.7rem,4vw,2.8rem);line-height:1}p{color:var(--muted)}main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;padding:16px}aside,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 26px rgba(15,23,42,.06)}aside{padding:14px;height:calc(100vh - 112px);overflow:auto}.stage{min-height:0}canvas{display:block;width:100%;height:auto;background:linear-gradient(#fbfdff,#eef4f8);border:1px solid var(--line);border-radius:12px}label{display:grid;grid-template-columns:112px 1fr 72px;gap:7px;align-items:center;margin:8px 0;font-weight:750;font-size:.86rem}label input[type=range]{grid-column:2}label output{grid-column:3;text-align:right;color:var(--teal);font-weight:900}input[type=range]{width:100%;accent-color:var(--teal)}select,button,input[type=number]{font:inherit;border:1px solid #c9d4df;border-radius:8px;padding:8px 9px;background:#fff;color:var(--ink)}button{cursor:pointer;font-weight:850}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:12px}.readout{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.readout span{display:block;color:var(--muted);font-size:.76rem;font-weight:850;text-transform:uppercase;letter-spacing:.04em}.readout strong{display:block;margin-top:4px;font-size:1.05rem}.formula{margin-top:12px;padding:12px;border:1px solid #dbe7f2;border-radius:10px;background:#f8fbff;color:#364152}.toplinks{margin-top:8px}.toplinks a{color:var(--blue);font-weight:850;text-decoration:none}@media(max-width:900px){main{grid-template-columns:1fr}aside{height:auto}}</style></head>
<body><header><h1>Efecto fotoelectrico</h1><p>Emision de electrones: frecuencia umbral, energia cinetica maxima y potencial de frenado.</p><div class="toplinks"><a href="./">Volver a Physics</a></div></header><main><aside><label>Frecuencia<input id="freq" type="range" min="3" max="12" step="0.05" value="7"><output id="freqOut">7.00</output></label><label>Funcion trabajo<input id="phi" type="range" min="1" max="5" step="0.05" value="2.3"><output id="phiOut">2.30</output></label><label>Intensidad<input id="intensity" type="range" min="0" max="100" step="1" value="55"><output id="intensityOut">55</output></label><label>Potencial frenado<input id="voltage" type="range" min="0" max="6" step="0.05" value="0"><output id="voltageOut">0.00</output></label></aside><section class="stage"><canvas id="world" width="1400" height="820"></canvas><div class="readouts"><div class="readout"><span>Kmax</span><strong id="kmaxRead"></strong></div><div class="readout"><span>Emision</span><strong id="emitRead"></strong></div><div class="readout"><span>V frenado</span><strong id="stopRead"></strong></div><div class="readout"><span>Corriente</span><strong id="currentRead"></strong></div></div><div class="panel formula">Einstein: Kmax = h f - phi. La intensidad cambia el numero de electrones, no su energia maxima.</div></section></main><script>
const $=s=>document.querySelector(s),canvas=$('#world'),ctx=canvas.getContext('2d');
function clear(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fbfdff';ctx.fillRect(0,0,canvas.width,canvas.height)}
function grid(){ctx.strokeStyle='rgba(23,32,47,.08)';ctx.lineWidth=1;for(let x=0;x<canvas.width;x+=70){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()}for(let y=0;y<canvas.height;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}}
function line(x1,y1,x2,y2,c='#17202f',w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function circle(x,y,r,c,w=2,fill=null){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke()}

function draw(){clear();grid();const f=+freq.value,ph=+phi.value,I=+intensity.value,V=+voltage.value,h=.414,K=Math.max(0,h*f-ph),emit=K>0,cur=emit?I*Math.max(0,1-V/Math.max(.001,K)):0;freqOut.textContent=f.toFixed(2);phiOut.textContent=ph.toFixed(2);intensityOut.textContent=I;voltageOut.textContent=V.toFixed(2);kmaxRead.textContent=K.toFixed(2)+' eV';emitRead.textContent=emit?'si':'no';stopRead.textContent=K.toFixed(2)+' V';currentRead.textContent=cur.toFixed(1)+' %';ctx.fillStyle='#777';ctx.fillRect(180,520,360,42);ctx.fillStyle='#d89818';for(let i=0;i<I/5;i++){line(250+i*10,130,360+i*2,520,'rgba(216,152,24,.25)',2)}if(emit){for(let i=0;i<Math.floor(cur/8);i++){const x=560+i*45,y=520-120*Math.sin((i+1)*.7);circle(x,y,7,'#0b63ce',2,'#8ec5ff');line(x-18,y+10,x+18,y-10,'#0b63ce',2)}}line(930,360,930,620,'#d64545',6);ctx.fillStyle='#17202f';ctx.fillText('metal',300,575);ctx.fillText('colector',895,340);requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
