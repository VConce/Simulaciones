<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Efecto Doppler | Physics</title><style>:root{--ink:#17202f;--muted:#607083;--paper:#f7f9fb;--panel:#fff;--line:#d9e2ec;--blue:#0b63ce;--teal:#087f8c;--gold:#d89818;--red:#d64545;--green:#14845f}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}header{padding:20px 24px;border-bottom:1px solid var(--line);background:#fff}h1{margin:0 0 6px;font-size:clamp(1.7rem,4vw,2.8rem);line-height:1}p{color:var(--muted)}main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;padding:16px}aside,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 26px rgba(15,23,42,.06)}aside{padding:14px;height:calc(100vh - 112px);overflow:auto}.stage{min-height:0}canvas{display:block;width:100%;height:auto;background:linear-gradient(#fbfdff,#eef4f8);border:1px solid var(--line);border-radius:12px}label{display:grid;grid-template-columns:112px 1fr 72px;gap:7px;align-items:center;margin:8px 0;font-weight:750;font-size:.86rem}label input[type=range]{grid-column:2}label output{grid-column:3;text-align:right;color:var(--teal);font-weight:900}input[type=range]{width:100%;accent-color:var(--teal)}select,button,input[type=number]{font:inherit;border:1px solid #c9d4df;border-radius:8px;padding:8px 9px;background:#fff;color:var(--ink)}button{cursor:pointer;font-weight:850}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:12px}.readout{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.readout span{display:block;color:var(--muted);font-size:.76rem;font-weight:850;text-transform:uppercase;letter-spacing:.04em}.readout strong{display:block;margin-top:4px;font-size:1.05rem}.formula{margin-top:12px;padding:12px;border:1px solid #dbe7f2;border-radius:10px;background:#f8fbff;color:#364152}.toplinks{margin-top:8px}.toplinks a{color:var(--blue);font-weight:850;text-decoration:none}@media(max-width:900px){main{grid-template-columns:1fr}aside{height:auto}}</style></head>
<body><header><h1>Efecto Doppler</h1><p>Frentes de onda de una fuente en movimiento y cambio de frecuencia observado.</p><div class="toplinks"><a href="./">Volver a Physics</a></div></header><main><aside><label>Velocidad fuente<input id="vs" type="range" min="-300" max="300" step="1" value="120"><output id="vsOut">120</output></label><label>Velocidad onda<input id="vwave" type="range" min="100" max="420" step="1" value="300"><output id="vwaveOut">300</output></label><label>Frecuencia emitida<input id="f0" type="range" min="1" max="8" step="0.1" value="3"><output id="f0Out">3.0</output></label><label>Posicion observador<input id="obs" type="range" min="150" max="1250" step="1" value="1050"><output id="obsOut">1050</output></label><div class="row"><button id="pause">Pausar</button><button id="reset" class="primary">Reiniciar</button></div></aside><section class="stage"><canvas id="world" width="1400" height="820"></canvas><div class="readouts"><div class="readout"><span>Frentes</span><strong id="frontRead"></strong></div><div class="readout"><span>f delante</span><strong id="fAheadRead"></strong></div><div class="readout"><span>f detras</span><strong id="fBackRead"></strong></div><div class="readout"><span>Mach</span><strong id="machRead"></strong></div></div><div class="panel formula">Para fuente movil y observador fijo: f' = f v/(v - v_s) delante y f' = f v/(v + v_s) detras.</div></section></main><script>
const $=s=>document.querySelector(s),canvas=$('#world'),ctx=canvas.getContext('2d');
function clear(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fbfdff';ctx.fillRect(0,0,canvas.width,canvas.height)}
function grid(){ctx.strokeStyle='rgba(23,32,47,.08)';ctx.lineWidth=1;for(let x=0;x<canvas.width;x+=70){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()}for(let y=0;y<canvas.height;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}}
function line(x1,y1,x2,y2,c='#17202f',w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function circle(x,y,r,c,w=2,fill=null){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke()}

let t=0,last=performance.now(),run=true,waves=[];function draw(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(run)t+=dt;clear();grid();const V=+vwave.value,Vs=+vs.value,F=+f0.value,ox=+obs.value;vsOut.textContent=Vs;vwaveOut.textContent=V;f0Out.textContent=F.toFixed(1);obsOut.textContent=ox;const sx=700+Vs*t; if(run&&(!waves.length||t-waves[waves.length-1].time>1/F))waves.push({x:sx,y:410,time:t});waves=waves.filter(w=>(t-w.time)*V<1300);for(const w of waves)circle(w.x,w.y,(t-w.time)*V,'rgba(11,99,206,.45)',2);circle(sx,410,16,'#d64545',2,'#d64545');line(ox,360,ox,460,'#087f8c',4);ctx.fillStyle='#087f8c';ctx.fillText('observador',ox-35,345);frontRead.textContent=waves.length;fAheadRead.textContent=(F*V/Math.max(1,V-Vs)).toFixed(2)+' Hz';fBackRead.textContent=(F*V/(V+Vs)).toFixed(2)+' Hz';machRead.textContent=(Math.abs(Vs)/V).toFixed(2);requestAnimationFrame(draw)}pause.onclick=()=>{run=!run;pause.textContent=run?'Pausar':'Continuar'};reset.onclick=()=>{t=0;waves=[]};requestAnimationFrame(draw);
</script></body></html>
