<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Interferencia de ondas | Physics</title><script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"]]},svg:{fontCache:"global"}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script><style>:root{--ink:#17202f;--muted:#607083;--paper:#f7f9fb;--panel:#fff;--line:#d9e2ec;--blue:#0b63ce;--teal:#087f8c;--gold:#d89818;--red:#d64545}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}header{padding:22px 24px;border-bottom:1px solid var(--line);background:#fff}h1{margin:0 0 6px;font-size:clamp(1.8rem,4vw,3rem);line-height:1}p{color:var(--muted)}main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;padding:16px}aside,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 26px rgba(15,23,42,.06)}aside{padding:14px;height:calc(100vh - 118px);overflow:auto}.panel{padding:14px}.stage{min-height:0}canvas{display:block;width:100%;height:auto;background:linear-gradient(#fbfdff,#eef4f8);border:1px solid var(--line);border-radius:12px;touch-action:none}label{display:grid;gap:6px;margin:12px 0;font-weight:700;font-size:.92rem}.inline{grid-template-columns:1fr auto;align-items:center;gap:10px}input[type=range]{width:100%;accent-color:var(--teal)}input[type=color]{width:42px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:#fff}select,button{font:inherit;border:1px solid #c9d4df;border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink)}button{cursor:pointer;font-weight:800}button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}.readout{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.readout span{display:block;color:var(--muted);font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.readout strong{display:block;margin-top:4px;font-size:1.1rem}.formula{padding:12px;margin-top:12px;border:1px solid #dbe7f2;border-radius:10px;background:#f8fbff;overflow:auto}.modes{display:grid;gap:7px;margin-top:10px}.modes button{text-align:left}.toplinks{margin-top:10px}.toplinks a{color:var(--blue);font-weight:800;text-decoration:none}@media(max-width:900px){main{grid-template-columns:1fr}aside{height:auto}}</style></head><body><header><h1>Interferencia de ondas</h1><p>Dos fuentes coherentes y mapa de intensidad.</p><div class="toplinks"><a href="./">Volver a Physics</a></div></header><main><aside><label class="inline">Parametro A <output id="ao">1.00</output><input id="a" type="range" min="0" max="2" step="0.01" value="1"></label><label class="inline">Parametro B <output id="bo">1.00</output><input id="b" type="range" min="0" max="2" step="0.01" value="1"></label><div class="row"><button id="pause">Pausar</button><button id="clear">Borrar</button></div><label class="inline">Color<input id="color" type="color" value="#0b63ce"></label></aside><section class="stage"><canvas id="world" width="1400" height="820"></canvas><div class="readouts"><div class="readout"><span>Lectura</span><strong id="r1"></strong></div><div class="readout"><span>Estado</span><strong id="r2"></strong></div></div><div class="panel formula" id="formula">\(I \propto |y_1+y_2|^2\)</div></section></main><script>const c=world,ctx=c.getContext('2d');let lam=90,phase=0;function draw(){let img=ctx.createImageData(c.width,c.height),s1={x:500,y:410},s2={x:900,y:410};for(let y=0;y<c.height;y+=2)for(let x=0;x<c.width;x+=2){let r1=Math.hypot(x-s1.x,y-s1.y),r2=Math.hypot(x-s2.x,y-s2.y),v=Math.sin(2*Math.PI*r1/lam)+Math.sin(2*Math.PI*r2/lam+phase),I=Math.min(255,Math.abs(v)*120);for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){let k=((y+dy)*c.width+x+dx)*4;img.data[k]=20;img.data[k+1]=80+I*.55;img.data[k+2]=140+I*.35;img.data[k+3]=255}}ctx.putImageData(img,0,0);ctx.fillStyle='#d64545';ctx.beginPath();ctx.arc(s1.x,s1.y,12,0,7);ctx.arc(s2.x,s2.y,12,0,7);ctx.fill();r1.textContent='Max: delta r = m lambda';r2.textContent='Min: delta r = (m+1/2) lambda'}a.oninput=e=>{lam=35+145*+e.target.value/2;ao.textContent=(+e.target.value).toFixed(2);draw()};b.oninput=e=>{phase=6.28*+e.target.value/2;bo.textContent=(+e.target.value).toFixed(2);draw()};pause.onclick=draw;clear.onclick=draw;draw();</script></body></html>
