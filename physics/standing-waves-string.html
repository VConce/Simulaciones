<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cuerda vibrante | Physics</title><style>:root{--ink:#17202f;--muted:#607083;--paper:#f7f9fb;--panel:#fff;--line:#d9e2ec;--blue:#0b63ce;--teal:#087f8c;--gold:#d89818;--red:#d64545;--green:#14845f}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}header{padding:20px 24px;border-bottom:1px solid var(--line);background:#fff}h1{margin:0 0 6px;font-size:clamp(1.7rem,4vw,2.8rem);line-height:1}p{color:var(--muted)}main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;padding:16px}aside,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 26px rgba(15,23,42,.06)}aside{padding:14px;height:calc(100vh - 112px);overflow:auto}.stage{min-height:0}canvas{display:block;width:100%;height:auto;background:linear-gradient(#fbfdff,#eef4f8);border:1px solid var(--line);border-radius:12px}label{display:grid;grid-template-columns:112px 1fr 72px;gap:7px;align-items:center;margin:8px 0;font-weight:750;font-size:.86rem}label input[type=range]{grid-column:2}label output{grid-column:3;text-align:right;color:var(--teal);font-weight:900}input[type=range]{width:100%;accent-color:var(--teal)}select,button,input[type=number]{font:inherit;border:1px solid #c9d4df;border-radius:8px;padding:8px 9px;background:#fff;color:var(--ink)}button{cursor:pointer;font-weight:850}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:12px}.readout{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.readout span{display:block;color:var(--muted);font-size:.76rem;font-weight:850;text-transform:uppercase;letter-spacing:.04em}.readout strong{display:block;margin-top:4px;font-size:1.05rem}.formula{margin-top:12px;padding:12px;border:1px solid #dbe7f2;border-radius:10px;background:#f8fbff;color:#364152}.toplinks{margin-top:8px}.toplinks a{color:var(--blue);font-weight:850;text-decoration:none}@media(max-width:900px){main{grid-template-columns:1fr}aside{height:auto}}</style></head>
<body><header><h1>Cuerda vibrante</h1><p>Modos estacionarios en una cuerda tensa: nodos, vientres y frecuencia propia.</p><div class="toplinks"><a href="./">Volver a Physics</a></div></header><main><aside><label>Modo n<input id="mode" type="range" min="1" max="8" step="1" value="2"><output id="modeOut">2</output></label><label>Longitud L<input id="L" type="range" min="0.5" max="2.5" step="0.01" value="1.2"><output id="LOut">1.20</output></label><label>Tension T<input id="T" type="range" min="5" max="120" step="1" value="48"><output id="TOut">48</output></label><label>Densidad mu<input id="mu" type="range" min="0.005" max="0.08" step="0.001" value="0.018"><output id="muOut">0.018</output></label><label>Amplitud<input id="amp" type="range" min="5" max="90" step="1" value="46"><output id="ampOut">46</output></label><div class="row"><button id="pause">Pausar</button><button id="reset" class="primary">Reiniciar</button></div></aside><section class="stage"><canvas id="world" width="1400" height="820"></canvas><div class="readouts"><div class="readout"><span>Frecuencia propia</span><strong id="fRead"></strong></div><div class="readout"><span>Velocidad de onda</span><strong id="vRead"></strong></div><div class="readout"><span>Nodos</span><strong id="nodesRead"></strong></div><div class="readout"><span>Estado</span><strong id="stateRead"></strong></div></div><div class="panel formula">f_n = n/(2L) sqrt(T/mu). La forma estacionaria ideal es y(x,t)=A sin(n pi x/L) cos(2 pi f_n t).</div></section></main><script>
const $=s=>document.querySelector(s),canvas=$('#world'),ctx=canvas.getContext('2d');
function clear(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fbfdff';ctx.fillRect(0,0,canvas.width,canvas.height)}
function grid(){ctx.strokeStyle='rgba(23,32,47,.08)';ctx.lineWidth=1;for(let x=0;x<canvas.width;x+=70){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()}for(let y=0;y<canvas.height;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}}
function line(x1,y1,x2,y2,c='#17202f',w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function circle(x,y,r,c,w=2,fill=null){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke()}

let t=0,last=performance.now(),run=true;
function draw(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(run)t+=dt;clear();grid();const n=+mode.value,Lv=+L.value,Tv=+T.value,muv=+mu.value,A=+amp.value;const v=Math.sqrt(Tv/muv),f=n*v/(2*Lv);modeOut.textContent=n;LOut.textContent=Lv.toFixed(2);TOut.textContent=Tv.toFixed(0);muOut.textContent=muv.toFixed(3);ampOut.textContent=A.toFixed(0);fRead.textContent=f.toFixed(2)+' Hz';vRead.textContent=v.toFixed(1)+' m/s';nodesRead.textContent=(n+1)+' nodos';stateRead.textContent=run?'en marcha':'pausado';const x0=110,x1=1290,y0=410;line(x0,y0,x1,y0,'rgba(23,32,47,.28)',2);ctx.strokeStyle='#0b63ce';ctx.lineWidth=4;ctx.beginPath();for(let i=0;i<=520;i++){const u=i/520,x=x0+(x1-x0)*u,y=y0-A*Math.sin(n*Math.PI*u)*Math.cos(2*Math.PI*f*t);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();for(let k=0;k<=n;k++){const x=x0+(x1-x0)*k/n;circle(x,y0,6,'#17202f',2,'#fff');ctx.fillStyle='#17202f';ctx.fillText('N',x-4,y0+24)}requestAnimationFrame(draw)}
pause.onclick=()=>{run=!run;pause.textContent=run?'Pausar':'Continuar'};reset.onclick=()=>{t=0};requestAnimationFrame(draw);
</script></body></html>
