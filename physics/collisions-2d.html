<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Colisiones 2D | Physics</title><style>:root{--ink:#17202f;--muted:#607083;--paper:#f7f9fb;--panel:#fff;--line:#d9e2ec;--blue:#0b63ce;--teal:#087f8c;--gold:#d89818;--red:#d64545;--green:#14845f}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}header{padding:20px 24px;border-bottom:1px solid var(--line);background:#fff}h1{margin:0 0 6px;font-size:clamp(1.7rem,4vw,2.8rem);line-height:1}p{color:var(--muted)}main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;padding:16px}aside,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 26px rgba(15,23,42,.06)}aside{padding:14px;height:calc(100vh - 112px);overflow:auto}.stage{min-height:0}canvas{display:block;width:100%;height:auto;background:linear-gradient(#fbfdff,#eef4f8);border:1px solid var(--line);border-radius:12px}label{display:grid;grid-template-columns:112px 1fr 72px;gap:7px;align-items:center;margin:8px 0;font-weight:750;font-size:.86rem}label input[type=range]{grid-column:2}label output{grid-column:3;text-align:right;color:var(--teal);font-weight:900}input[type=range]{width:100%;accent-color:var(--teal)}select,button,input[type=number]{font:inherit;border:1px solid #c9d4df;border-radius:8px;padding:8px 9px;background:#fff;color:var(--ink)}button{cursor:pointer;font-weight:850}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:12px}.readout{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.readout span{display:block;color:var(--muted);font-size:.76rem;font-weight:850;text-transform:uppercase;letter-spacing:.04em}.readout strong{display:block;margin-top:4px;font-size:1.05rem}.formula{margin-top:12px;padding:12px;border:1px solid #dbe7f2;border-radius:10px;background:#f8fbff;color:#364152}.toplinks{margin-top:8px}.toplinks a{color:var(--blue);font-weight:850;text-decoration:none}@media(max-width:900px){main{grid-template-columns:1fr}aside{height:auto}}</style></head>
<body><header><h1>Colisiones 2D</h1><p>Choques elasticos e inelasticos entre dos discos: momento, energia y coeficiente de restitucion.</p><div class="toplinks"><a href="./">Volver a Physics</a></div></header><main><aside><label>Masa 1<input id="m1" type="range" min="0.5" max="5" step="0.1" value="1"><output id="m1Out">1.0</output></label><label>Masa 2<input id="m2" type="range" min="0.5" max="5" step="0.1" value="1.5"><output id="m2Out">1.5</output></label><label>Velocidad inicial<input id="speed" type="range" min="1" max="9" step="0.1" value="5"><output id="speedOut">5.0</output></label><label>Parametro impacto<input id="impact" type="range" min="-120" max="120" step="1" value="55"><output id="impactOut">55</output></label><label>Restitucion e<input id="e" type="range" min="0" max="1" step="0.01" value="1"><output id="eOut">1.00</output></label><div class="row"><button id="pause">Pausar</button><button id="reset" class="primary">Reiniciar</button></div></aside><section class="stage"><canvas id="world" width="1400" height="820"></canvas><div class="readouts"><div class="readout"><span>Momento total</span><strong id="pRead"></strong></div><div class="readout"><span>Energia cinetica</span><strong id="kRead"></strong></div><div class="readout"><span>Evento</span><strong id="eventRead"></strong></div><div class="readout"><span>Restitucion</span><strong id="eRead"></strong></div></div><div class="panel formula">En el eje normal del choque: v_rel,despues = -e v_rel,antes. Si e=1 el choque es elastico.</div></section></main><script>
const $=s=>document.querySelector(s),canvas=$('#world'),ctx=canvas.getContext('2d');
function clear(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fbfdff';ctx.fillRect(0,0,canvas.width,canvas.height)}
function grid(){ctx.strokeStyle='rgba(23,32,47,.08)';ctx.lineWidth=1;for(let x=0;x<canvas.width;x+=70){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()}for(let y=0;y<canvas.height;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}}
function line(x1,y1,x2,y2,c='#17202f',w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function circle(x,y,r,c,w=2,fill=null){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke()}

let run=true,b1,b2,hit=false;function init(){b1={x:260,y:410+(+impact.value),vx:+speed.value*18,vy:0,r:34};b2={x:1030,y:410,vx:0,vy:0,r:42};hit=false}function collide(){const dx=b2.x-b1.x,dy=b2.y-b1.y,d=Math.hypot(dx,dy),min=b1.r+b2.r;if(d>=min)return;const nx=dx/d,ny=dy/d,m1v=+m1.value,m2v=+m2.value,rvx=b2.vx-b1.vx,rvy=b2.vy-b1.vy,rel=rvx*nx+rvy*ny;if(rel>=0)return;const j=-(1+(+e.value))*rel/(1/m1v+1/m2v);b1.vx-=j*nx/m1v;b1.vy-=j*ny/m1v;b2.vx+=j*nx/m2v;b2.vy+=j*ny/m2v;const corr=(min-d)/2;b1.x-=nx*corr;b1.y-=ny*corr;b2.x+=nx*corr;b2.y+=ny*corr;hit=true}function draw(){clear();grid();m1Out.textContent=(+m1.value).toFixed(1);m2Out.textContent=(+m2.value).toFixed(1);speedOut.textContent=(+speed.value).toFixed(1);impactOut.textContent=(+impact.value).toFixed(0);eOut.textContent=(+e.value).toFixed(2);if(run){for(let k=0;k<2;k++){b1.x+=b1.vx*.016;b1.y+=b1.vy*.016;b2.x+=b2.vx*.016;b2.y+=b2.vy*.016;collide()}}for(const b of [b1,b2]){if(b.x<b.r||b.x>1400-b.r)b.vx*=-1;if(b.y<b.r||b.y>820-b.r)b.vy*=-1}circle(b1.x,b1.y,b1.r,'#0b63ce',3,'#8ec5ff');circle(b2.x,b2.y,b2.r,'#d64545',3,'#ffb3b3');const P=Math.hypot((+m1.value)*b1.vx+(+m2.value)*b2.vx,(+m1.value)*b1.vy+(+m2.value)*b2.vy),K=.5*(+m1.value)*(b1.vx*b1.vx+b1.vy*b1.vy)+.5*(+m2.value)*(b2.vx*b2.vx+b2.vy*b2.vy);pRead.textContent=P.toFixed(1);kRead.textContent=K.toFixed(0);eventRead.textContent=hit?'choque producido':'antes del choque';eRead.textContent=(+e.value).toFixed(2);requestAnimationFrame(draw)}pause.onclick=()=>{run=!run;pause.textContent=run?'Pausar':'Continuar'};reset.onclick=init;init();requestAnimationFrame(draw);
</script></body></html>
