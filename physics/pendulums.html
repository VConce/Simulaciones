<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pendulos en cadena | Physics</title><script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"]]},svg:{fontCache:"global"}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script><style>:root{--ink:#17202f;--muted:#607083;--paper:#f7f9fb;--panel:#fff;--line:#d9e2ec;--blue:#0b63ce;--teal:#087f8c;--gold:#d89818;--red:#d64545}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}header{padding:22px 24px;border-bottom:1px solid var(--line);background:#fff}h1{margin:0 0 6px;font-size:clamp(1.8rem,4vw,3rem);line-height:1}p{color:var(--muted)}main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;padding:16px}aside,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 26px rgba(15,23,42,.06)}aside{padding:14px;height:calc(100vh - 118px);overflow:auto}.panel{padding:14px}.stage{min-height:0;position:relative}canvas{display:block;width:100%;height:auto;background:linear-gradient(#fbfdff,#eef4f8);border:1px solid var(--line);border-radius:12px;touch-action:none}label{display:grid;gap:5px;margin:7px 0;font-weight:700;font-size:.84rem}.inline{grid-template-columns:112px minmax(82px,1fr) 72px;align-items:center;gap:6px}.inline input[type=range]{grid-column:2;grid-row:1}.inline output{grid-column:3;grid-row:1;text-align:right;color:var(--teal);font-weight:900}.inline input[type=color]{grid-column:2/4;grid-row:1}input[type=range]{width:100%;accent-color:var(--teal)}input[type=color]{width:42px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:#fff}select,button{font:inherit;border:1px solid #c9d4df;border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink)}button{cursor:pointer;font-weight:800}button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}.readout{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.readout span{display:block;color:var(--muted);font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.readout strong{display:block;margin-top:4px;font-size:1.1rem}.formula{padding:12px;margin-top:12px;border:1px solid #dbe7f2;border-radius:10px;background:#f8fbff;overflow:auto}.modes{display:grid;gap:6px;margin-top:8px}.modes button{text-align:left;padding:7px 8px}.modeMenu{position:absolute;z-index:10;width:min(330px,calc(100% - 24px));max-height:360px;overflow:auto;padding:10px;border:1px solid #c9d4df;border-radius:12px;background:#fff;box-shadow:0 18px 46px rgba(15,23,42,.20)}.modeMenu[hidden]{display:none}.modeMenu h3{margin:0 0 8px;font-size:1rem}.modeMenu button{width:100%;text-align:left;margin:3px 0;padding:7px 8px}.toplinks{margin-top:10px}.toplinks a{color:var(--blue);font-weight:800;text-decoration:none}@media(max-width:900px){main{grid-template-columns:1fr}aside{height:auto}}</style></head><body><header><h1>Pendulos en cadena</h1><p>Un pendulo colgando de otro: cadena serial de hasta cinco bobs con rastro, arrastre y modos linealizados.</p><div class="toplinks"><a href="./">Volver a Physics</a></div></header><main><aside><label class="inline">Numero de bobs <output id="nOut">3</output><input id="n" type="range" min="1" max="5" step="1" value="3"></label><label class="inline">Longitud por tramo <output id="lOut">1.00 m</output><input id="len" type="range" min="0.25" max="2.2" step="0.01" value="1"></label><label class="inline">Gravedad g <output id="gOut">9.81</output><input id="grav" type="range" min="1" max="20" step="0.01" value="9.81"></label><label class="inline">Amortiguamiento <output id="dOut">0.000</output><input id="damping" type="range" min="0" max="0.08" step="0.001" value="0"></label><label class="inline">Precision restricciones <output id="iterOut">14</output><input id="iters" type="range" min="4" max="32" step="1" value="14"></label><label class="inline">Escala temporal <output id="timeOut">1.00x</output><input id="timeScale" type="range" min="0.1" max="2" step="0.01" value="1"></label><label class="inline">Orden periodo <output id="orderOut">2</output><input id="order" type="range" min="0" max="4" step="1" value="2"></label><hr><label>Bob a editar<select id="selected"></select></label><label class="inline">Angulo inicial <output id="thetaOut">25 deg</output><input id="theta" type="range" min="-175" max="175" step="1" value="25"></label><label class="inline">Velocidad angular <output id="omegaOut">0.00 rad/s</output><input id="omega" type="range" min="-10" max="10" step="0.01" value="0"></label><div class="row"><button id="applyOne" class="primary">Aplicar bob</button><button id="applyAll">Aplicar cadena</button></div><div class="row"><button id="reset">Reiniciar</button><button id="pause">Pausar</button></div><div class="row"><button id="clearTrail">Borrar rastro</button><button id="calm">Calmar</button></div><button id="trailModeBtn" class="primary">Rastro: desvaneciente</button><label class="inline">Color pendulos<input id="pendColor" type="color" value="#0b63ce"></label><label class="inline">Color rastro<input id="trailColor" type="color" value="#d89818"></label><div class="row"><button id="openModes" class="primary">Modos normales</button><button id="hideModes">Cerrar menu</button></div><div id="modes" class="modes"></div></aside><section class="stage"><canvas id="world" width="1400" height="820"></canvas><div id="modeMenu" class="modeMenu" hidden></div><div class="readouts"><div class="readout"><span>Periodo primer orden</span><strong id="smallT"></strong></div><div class="readout"><span>Periodo con orden</span><strong id="approxT"></strong></div><div class="readout"><span>Energia relativa</span><strong id="energyRead"></strong></div><div class="readout"><span>Interaccion</span><strong>arrastra cualquier bob</strong></div></div><div class="panel formula" id="formula"></div></section></main><script>
const $=s=>document.querySelector(s),canvas=$('#world'),ctx=canvas.getContext('2d');
const S={n:3,L:1,g:9.81,d:0,iters:14,time:1,order:2,sel:0,run:true,trailMode:'fade',color:'#0b63ce',trailColor:'#d89818',p:[],prev:[],trail:[],drag:null,last:performance.now()};
const coeff=[1,1/16,11/3072,173/737280,22931/1321205760];
function pivot(){return{x:canvas.width/2,y:105}}
function pix(){return 105*Math.sqrt(S.L)}
function ensure(){while(S.p.length<S.n+1){S.p.push({x:0,y:0});S.prev.push({x:0,y:0});S.trail.push([])}S.p.length=S.n+1;S.prev.length=S.n+1;S.trail.length=S.n+1;const pv=pivot();S.p[0]={x:pv.x,y:pv.y};S.prev[0]={x:pv.x,y:pv.y}}
function angles(){const a=[];for(let i=1;i<=S.n;i++){const A=S.p[i-1],B=S.p[i];a.push(Math.atan2(B.x-A.x,B.y-A.y))}return a}
function angularVelocities(){const a=angles(),w=[];const dt=1/60;for(let i=1;i<=S.n;i++){const A=S.prev[i-1],B=S.prev[i];const old=Math.atan2(B.x-A.x,B.y-A.y);let d=a[i-1]-old;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;w.push(d/dt)}return w}
function buildFromAngles(a,w){ensure();const L=pix(),pv=pivot();S.p[0]={x:pv.x,y:pv.y};S.prev[0]={x:pv.x,y:pv.y};let vx=0,vy=0;for(let i=1;i<=S.n;i++){const th=a[i-1]||0,om=w[i-1]||0;const parent=S.p[i-1];const x=parent.x+L*Math.sin(th),y=parent.y+L*Math.cos(th);vx+=L*om*Math.cos(th);vy+=-L*om*Math.sin(th);S.p[i]={x,y};S.prev[i]={x:x-vx/60,y:y-vy/60};S.trail[i]=[]}}
function init(){ensure();const a=Array(S.n).fill(0);const w=Array(S.n).fill(0);a[0]=25*Math.PI/180;buildFromAngles(a,w);syncSelected()}
function constrain(){const L=pix(),pv=pivot();S.p[0].x=pv.x;S.p[0].y=pv.y;for(let k=0;k<S.iters;k++){S.p[0].x=pv.x;S.p[0].y=pv.y;for(let i=1;i<=S.n;i++){const A=S.p[i-1],B=S.p[i];let dx=B.x-A.x,dy=B.y-A.y;let d=Math.hypot(dx,dy)||1;let diff=(d-L)/d;if(i===1){B.x-=dx*diff;B.y-=dy*diff}else{A.x+=dx*diff*.5;A.y+=dy*diff*.5;B.x-=dx*diff*.5;B.y-=dy*diff*.5}}}}
function step(dt){const sub=Math.max(1,Math.ceil(dt/.012));const h=dt/sub;for(let s=0;s<sub;s++){for(let i=1;i<=S.n;i++){if(S.drag&&S.drag.i===i)continue;const p=S.p[i],pr=S.prev[i];const vx=(p.x-pr.x)*(1-S.d),vy=(p.y-pr.y)*(1-S.d);pr.x=p.x;pr.y=p.y;p.x+=vx;p.y+=vy+S.g*95*h*h}constrain()}}
function currentEnergy(){let e=0;const Lm=S.L,dt=1/60;for(let i=1;i<=S.n;i++){const p=S.p[i],pr=S.prev[i];const vx=(p.x-pr.x)/dt/100,vy=(p.y-pr.y)/dt/100;e+=.5*(vx*vx+vy*vy)+S.g*((p.y-pivot().y)/100)}return e}
function period(theta0){const Leff=S.L*S.n;let s=0;for(let i=0;i<=S.order;i++)s+=coeff[i]*Math.pow(theta0,2*i);return 2*Math.PI*Math.sqrt(Leff/S.g)*s}
function cholesky(A){const n=A.length,L=Array.from({length:n},()=>Array(n).fill(0));for(let i=0;i<n;i++){for(let j=0;j<=i;j++){let s=A[i][j];for(let k=0;k<j;k++)s-=L[i][k]*L[j][k];L[i][j]=i===j?Math.sqrt(Math.max(s,1e-12)):s/L[j][j]}}return L}
function solveLower(L,b){const n=L.length,x=Array(n).fill(0);for(let i=0;i<n;i++){let s=b[i];for(let k=0;k<i;k++)s-=L[i][k]*x[k];x[i]=s/L[i][i]}return x}
function solveUpperFromLower(L,b){const n=L.length,x=Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=b[i];for(let k=i+1;k<n;k++)s-=L[k][i]*x[k];x[i]=s/L[i][i]}return x}
function jacobiSym(A){const n=A.length,V=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?1:0));A=A.map(r=>r.slice());for(let it=0;it<80;it++){let p=0,q=1,best=0;for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const v=Math.abs(A[i][j]);if(v>best){best=v;p=i;q=j}}if(best<1e-10)break;const phi=.5*Math.atan2(2*A[p][q],A[q][q]-A[p][p]),c=Math.cos(phi),s=Math.sin(phi);for(let k=0;k<n;k++){const aip=A[k][p],aiq=A[k][q];A[k][p]=c*aip-s*aiq;A[k][q]=s*aip+c*aiq}for(let k=0;k<n;k++){const apk=A[p][k],aqk=A[q][k];A[p][k]=c*apk-s*aqk;A[q][k]=s*apk+c*aqk}for(let k=0;k<n;k++){const vip=V[k][p],viq=V[k][q];V[k][p]=c*vip-s*viq;V[k][q]=s*vip+c*viq}}return Array.from({length:n},(_,i)=>({value:A[i][i],vec:V.map(r=>r[i])})).sort((a,b)=>a.value-b.value)}
function normalModes(){const n=S.n,M=Array.from({length:n},()=>Array(n).fill(0)),K=Array.from({length:n},()=>Array(n).fill(0));for(let i=0;i<n;i++){K[i][i]=n-i;for(let j=0;j<n;j++)M[i][j]=n-Math.max(i,j)}const L=cholesky(M),A=Array.from({length:n},()=>Array(n).fill(0));for(let j=0;j<n;j++){const e=Array.from({length:n},(_,i)=>i===j?1:0),v=solveUpperFromLower(L,e),kv=v.map((x,i)=>K[i][i]*x),col=solveLower(L,kv);for(let i=0;i<n;i++)A[i][j]=col[i]}const amp=28*Math.PI/180;return jacobiSym(A).map((m,idx)=>{let q=solveUpperFromLower(L,m.vec),mx=Math.max(...q.map(Math.abs))||1;if(q[0]<0)q=q.map(x=>-x);return{shape:q.map(x=>x/mx*amp),omega:Math.sqrt(Math.max(0,m.value)*S.g/S.L),name:'Modo normal '+(idx+1)}})}
function applyPattern(kind){const n=S.n,amp=28*Math.PI/180,a=Array(n).fill(0),w=Array(n).fill(0);if(kind==='inphase')for(let i=0;i<n;i++)a[i]=amp;else if(kind==='alternate')for(let i=0;i<n;i++)a[i]=(i%2?-.75:1)*amp;else if(kind==='cascade')for(let i=0;i<n;i++)a[i]=amp*(1-i/(Math.max(1,n)));else if(kind==='kick'){a[n-1]=amp*.35;w[n-1]=5}else if(kind==='quiet'){for(let i=0;i<n;i++)a[i]=0}buildFromAngles(a,w);syncSelected()}
function addButton(container,text,fn,closeAfter){const b=document.createElement('button');b.textContent=text;b.onclick=()=>{fn();if(closeAfter)modeMenu.hidden=true};container.appendChild(b)}
function addModeButtons(container,closeAfter=false){container.innerHTML='';normalModes().forEach((m,i)=>addButton(container,m.name+' - omega = '+m.omega.toFixed(2)+' rad/s',()=>buildFromAngles(m.shape,Array(S.n).fill(0)),closeAfter));addButton(container,'Todos en fase',()=>applyPattern('inphase'),closeAfter);addButton(container,'Alternante',()=>applyPattern('alternate'),closeAfter);addButton(container,'Cascada decreciente',()=>applyPattern('cascade'),closeAfter);addButton(container,'Impulso al ultimo bob',()=>applyPattern('kick'),closeAfter);addButton(container,'Equilibrio en reposo',()=>applyPattern('quiet'),closeAfter)}
function renderModes(){addModeButtons(modes,false)}
function openModeMenuAt(clientX,clientY){const r=canvas.getBoundingClientRect();modeMenu.innerHTML='<h3>Modos normales</h3>';const box=document.createElement('div');modeMenu.appendChild(box);addModeButtons(box,true);const x=Math.max(8,Math.min(clientX-r.left+12,r.width-342));const y=Math.max(8,Math.min(clientY-r.top+12,r.height-372));modeMenu.style.left=x+'px';modeMenu.style.top=y+'px';modeMenu.hidden=false}
function syncSelected(){selected.innerHTML='';for(let i=1;i<=S.n;i++){const o=document.createElement('option');o.value=i;o.textContent='Bob '+i;selected.appendChild(o)}if(S.sel<1)S.sel=1;if(S.sel>S.n)S.sel=S.n;selected.value=S.sel;const a=angles(),w=angularVelocities();theta.value=(a[S.sel-1]*180/Math.PI).toFixed(0);omega.value=(w[S.sel-1]||0).toFixed(2);sync()}
function sync(){S.n=+n.value;S.L=+len.value;S.g=+grav.value;S.d=+damping.value;S.iters=+iters.value;S.time=+timeScale.value;S.order=+order.value;ensure();nOut.textContent=S.n;lOut.textContent=S.L.toFixed(2)+' m';gOut.textContent=S.g.toFixed(2);dOut.textContent=S.d.toFixed(3);iterOut.textContent=S.iters;timeOut.textContent=S.time.toFixed(2)+'x';orderOut.textContent=S.order;const a=angles(),w=angularVelocities();thetaOut.textContent=(a[S.sel-1]*180/Math.PI).toFixed(0)+' deg';omegaOut.textContent=(w[S.sel-1]||0).toFixed(2)+' rad/s';const amp=Math.abs(a[S.sel-1]||0);smallT.textContent=period(0).toFixed(3)+' s';approxT.textContent=period(amp).toFixed(3)+' s';const terms=['1','\\frac{1}{16}\\theta_0^2','\\frac{11}{3072}\\theta_0^4','\\frac{173}{737280}\\theta_0^6','\\frac{22931}{1321205760}\\theta_0^8'].slice(0,S.order+1).join(' + ');formula.innerHTML='\\( T \\approx 2\\pi\\sqrt{(N L)/g}\\left('+terms+'\\right) \\)';if(window.MathJax)MathJax.typesetPromise?.([formula]);renderModes()}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fbfdff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#d9e2ec';ctx.lineWidth=1;for(let y=100;y<canvas.height;y+=80){ctx.beginPath();ctx.moveTo(60,y);ctx.lineTo(canvas.width-60,y);ctx.stroke()}for(let i=1;i<=S.n;i++){const tr=S.trail[i];if(S.trailMode!=='none'&&tr.length>1){for(let j=1;j<tr.length;j++){const alpha=S.trailMode==='fixed'?.55:j/tr.length*.55;ctx.strokeStyle=rgba(S.trailColor,alpha*(i===S.n?1:.55));ctx.lineWidth=i===S.n?2.5:1.4;ctx.beginPath();ctx.moveTo(tr[j-1].x,tr[j-1].y);ctx.lineTo(tr[j].x,tr[j].y);ctx.stroke()}}}ctx.strokeStyle=S.color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(S.p[0].x,S.p[0].y);for(let i=1;i<=S.n;i++)ctx.lineTo(S.p[i].x,S.p[i].y);ctx.stroke();ctx.fillStyle='#17202f';ctx.beginPath();ctx.arc(S.p[0].x,S.p[0].y,8,0,7);ctx.fill();for(let i=1;i<=S.n;i++){ctx.fillStyle=S.color;ctx.beginPath();ctx.arc(S.p[i].x,S.p[i].y,i===S.n?18:14,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 12px system-ui';ctx.textAlign='center';ctx.fillText(String(i),S.p[i].x,S.p[i].y+4)}energyRead.textContent=currentEnergy().toFixed(2)}
function point(ev){const r=canvas.getBoundingClientRect();return{x:(ev.clientX-r.left)*canvas.width/r.width,y:(ev.clientY-r.top)*canvas.height/r.height}}
function nearest(p){let best=0,bd=1e9;for(let i=1;i<=S.n;i++){const d=Math.hypot(p.x-S.p[i].x,p.y-S.p[i].y);if(d<bd&&d<34){best=i;bd=d}}return best}
canvas.oncontextmenu=e=>{e.preventDefault();openModeMenuAt(e.clientX,e.clientY)};
canvas.onpointerdown=e=>{modeMenu.hidden=true;const p=point(e),i=nearest(p);if(i){S.drag={i,last:p,start:p,lastT:performance.now(),vx:0,vy:0,peak:0};S.sel=i;syncSelected();canvas.setPointerCapture(e.pointerId)}};
canvas.onpointermove=e=>{if(!S.drag)return;const p=point(e),now=performance.now(),dt=Math.max(.001,(now-S.drag.lastT)/1000);const ivx=(p.x-S.drag.last.x)/dt,ivy=(p.y-S.drag.last.y)/dt;S.drag.vx=S.drag.vx*.82+ivx*.18;S.drag.vy=S.drag.vy*.82+ivy*.18;S.drag.peak=Math.max(S.drag.peak,Math.hypot(ivx,ivy));S.p[S.drag.i].x=p.x;S.p[S.drag.i].y=p.y;S.prev[S.drag.i].x=p.x;S.prev[S.drag.i].y=p.y;S.drag.last=p;S.drag.lastT=now;constrain()};
canvas.onpointerup=()=>{if(S.drag){const i=S.drag.i,now=performance.now();let vx=S.drag.vx,vy=S.drag.vy;const speed=Math.hypot(vx,vy),dragDist=Math.hypot(S.drag.last.x-S.drag.start.x,S.drag.last.y-S.drag.start.y),fresh=now-S.drag.lastT<170;const intentional=fresh&&dragDist>28&&S.drag.peak>780&&speed>520;if(intentional){const scale=Math.min(1,1700/speed)*.32;S.prev[i].x=S.p[i].x-vx*scale/60;S.prev[i].y=S.p[i].y-vy*scale/60}else{S.prev[i].x=S.p[i].x;S.prev[i].y=S.p[i].y}S.drag=null}};
function loop(now){const dt=Math.min(.035,(now-S.last)/1000)*S.time;S.last=now;if(S.run&&!S.drag)step(dt);if(S.trailMode!=='none'){for(let i=1;i<=S.n;i++){S.trail[i].push({x:S.p[i].x,y:S.p[i].y});const max=S.trailMode==='fixed'?2600:150;if(S.trail[i].length>max)S.trail[i].shift()}}draw();requestAnimationFrame(loop)}
function setTrailMode(mode){S.trailMode=mode;trailModeBtn.textContent='Rastro: '+(mode==='fixed'?'fijo':mode==='fade'?'desvaneciente':'sin rastro');trailModeBtn.classList.toggle('primary',mode!=='none');if(mode==='none')S.trail.forEach(t=>t.length=0)}
[n,len,grav,damping,iters,timeScale,order].forEach(el=>el.oninput=()=>{const old=S.n;sync();if(+n.value!==old)init()});selected.onchange=e=>{S.sel=+e.target.value;syncSelected()};applyOne.onclick=()=>{const a=angles(),w=angularVelocities();a[S.sel-1]=+theta.value*Math.PI/180;w[S.sel-1]=+omega.value;buildFromAngles(a,w);syncSelected()};applyAll.onclick=()=>{const a=Array(S.n).fill(+theta.value*Math.PI/180),w=Array(S.n).fill(+omega.value);buildFromAngles(a,w);syncSelected()};reset.onclick=init;pause.onclick=()=>{S.run=!S.run;pause.textContent=S.run?'Pausar':'Continuar'};clearTrail.onclick=()=>S.trail.forEach(t=>t.length=0);calm.onclick=()=>{for(let i=1;i<=S.n;i++){S.prev[i].x=S.p[i].x;S.prev[i].y=S.p[i].y}};trailModeBtn.onclick=()=>setTrailMode(S.trailMode==='fade'?'fixed':S.trailMode==='fixed'?'none':'fade');pendColor.oninput=e=>S.color=e.target.value;trailColor.oninput=e=>S.trailColor=e.target.value;openModes.onclick=()=>{const r=canvas.getBoundingClientRect();openModeMenuAt(r.left+24,r.top+24)};hideModes.onclick=()=>modeMenu.hidden=true;S.color=pendColor.value;S.trailColor=trailColor.value;setTrailMode('fade');init();requestAnimationFrame(loop);
</script></body></html>
