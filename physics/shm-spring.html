tyle=color.value;ctx.fillRect(cx+pos-40,y-40,80,80);ctx.strokeStyle='#7b8794';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(120,y);ctx.lineTo(cx+pos-40,y);ctx.stroke();r1.textContent='T = '+(2*Math.PI/w).toFixed(2)+' s';r2.textContent='E ~ '+(.5*w*w*A*A).toFixed(0)}function loop(){if(run)t+=.016;draw();requestAnimationFrame(loop)}a.oninput=e=>{A=20+300*+e.target.value/2;ao.textContent=(+e.target.value).toFixed(2)};b.oninput=e=>{w=.2+4.8*+e.target.value/2;bo.textContent=(+e.target.value).toFixed(2)};pause.onclick=()=>run=!run;clear.onclick=()=>tr=[];loop();</script></body></html>
