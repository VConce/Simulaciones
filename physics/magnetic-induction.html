<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Induccion electromagnetica | Physics</title><style>:root{--ink:#17202f;--muted:#607083;--paper:#f7f9fb;--panel:#fff;--line:#d9e2ec;--blue:#0b63ce;--teal:#087f8c;--gold:#d89818;--red:#d64545;--green:#14845f}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}header{padding:20px 24px;border-bottom:1px solid var(--line);background:#fff}h1{margin:0 0 6px;font-size:clamp(1.7rem,4vw,2.8rem);line-height:1}p{color:var(--muted)}main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;padding:16px}aside,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 26px rgba(15,23,42,.06)}aside{padding:14px;height:calc(100vh - 112px);overflow:auto}.stage{min-height:0}canvas{display:block;width:100%;height:auto;background:linear-gradient(#fbfdff,#eef4f8);border:1px solid var(--line);border-radius:12px}label{display:grid;grid-template-columns:112px 1fr 72px;gap:7px;align-items:center;margin:8px 0;font-weight:750;font-size:.86rem}label input[type=range]{grid-column:2}label output{grid-column:3;text-align:right;color:var(--teal);font-weight:900}input[type=range]{width:100%;accent-color:var(--teal)}select,button,input[type=number]{font:inherit;border:1px solid #c9d4df;border-radius:8px;padding:8px 9px;background:#fff;color:var(--ink)}button{cursor:pointer;font-weight:850}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:12px}.readout{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.readout span{display:block;color:var(--muted);font-size:.76rem;font-weight:850;text-transform:uppercase;letter-spacing:.04em}.readout strong{display:block;margin-top:4px;font-size:1.05rem}.formula{margin-top:12px;padding:12px;border:1px solid #dbe7f2;border-radius:10px;background:#f8fbff;color:#364152}.toplinks{margin-top:8px}.toplinks a{color:var(--blue);font-weight:850;text-decoration:none}@media(max-width:900px){main{grid-template-columns:1fr}aside{height:auto}}</style></head>
<body><header><h1>Induccion electromagnetica</h1><p>Ley de Faraday-Lenz: flujo magnetico variable, fem inducida y corriente en una espira.</p><div class="toplinks"><a href="./">Volver a Physics</a></div></header><main><aside><label>Campo B0<input id="B0" type="range" min="0.1" max="2.5" step="0.01" value="1"><output id="B0Out">1.00</output></label><label>Area espira<input id="area" type="range" min="0.2" max="3" step="0.05" value="1.2"><output id="areaOut">1.20</output></label><label>Velocidad angular<input id="omega" type="range" min="0" max="8" step="0.1" value="2.5"><output id="omegaOut">2.5</output></label><label>Resistencia<input id="res" type="range" min="0.2" max="8" step="0.1" value="2"><output id="resOut">2.0</output></label><div class="row"><button id="pause">Pausar</button><button id="reset" class="primary">Reiniciar</button></div></aside><section class="stage"><canvas id="world" width="1400" height="820"></canvas><div class="readouts"><div class="readout"><span>Flujo</span><strong id="fluxRead"></strong></div><div class="readout"><span>Fem</span><strong id="emfRead"></strong></div><div class="readout"><span>Corriente</span><strong id="iRead"></strong></div><div class="readout"><span>Sentido</span><strong id="senseRead"></strong></div></div><div class="panel formula">Phi = B A cos(theta). Fem inducida: epsilon = - dPhi/dt. El signo representa la ley de Lenz.</div></section></main><script>
const $=s=>document.querySelector(s),canvas=$('#world'),ctx=canvas.getContext('2d');
function clear(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fbfdff';ctx.fillRect(0,0,canvas.width,canvas.height)}
function grid(){ctx.strokeStyle='rgba(23,32,47,.08)';ctx.lineWidth=1;for(let x=0;x<canvas.width;x+=70){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()}for(let y=0;y<canvas.height;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}}
function line(x1,y1,x2,y2,c='#17202f',w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function circle(x,y,r,c,w=2,fill=null){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke()}

let t=0,last=performance.now(),run=true;function draw(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(run)t+=dt;clear();grid();const B=+B0.value,A=+area.value,w=+omega.value,R=+res.value,th=w*t,flux=B*A*Math.cos(th),emf=B*A*w*Math.sin(th),I=emf/R;B0Out.textContent=B.toFixed(2);areaOut.textContent=A.toFixed(2);omegaOut.textContent=w.toFixed(1);resOut.textContent=R.toFixed(1);fluxRead.textContent=flux.toFixed(2)+' Wb';emfRead.textContent=emf.toFixed(2)+' V';iRead.textContent=I.toFixed(2)+' A';senseRead.textContent=I>=0?'antihorario':'horario';for(let x=120;x<1280;x+=70)for(let y=120;y<700;y+=70){ctx.fillStyle='rgba(8,127,140,.25)';ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill()}const cx=700,cy=410,rx=170*Math.abs(Math.cos(th))+35,ry=130;ctx.save();ctx.translate(cx,cy);ctx.rotate(.15*Math.sin(th));ctx.strokeStyle='#0b63ce';ctx.lineWidth=7;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,7);ctx.stroke();ctx.restore();ctx.strokeStyle=I>=0?'#14845f':'#d64545';ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx,cy,220,0,Math.PI*1.5,I<0);ctx.stroke();ctx.fillStyle=I>=0?'#14845f':'#d64545';ctx.fillText('corriente inducida',590,185);requestAnimationFrame(draw)}pause.onclick=()=>{run=!run;pause.textContent=run?'Pausar':'Continuar'};reset.onclick=()=>{t=0};requestAnimationFrame(draw);
</script></body></html>
