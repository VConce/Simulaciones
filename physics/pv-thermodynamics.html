<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ciclos termodinamicos PV | Physics</title><style>:root{--ink:#17202f;--muted:#607083;--paper:#f7f9fb;--panel:#fff;--line:#d9e2ec;--blue:#0b63ce;--teal:#087f8c;--gold:#d89818;--red:#d64545;--green:#14845f}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}header{padding:20px 24px;border-bottom:1px solid var(--line);background:#fff}h1{margin:0 0 6px;font-size:clamp(1.7rem,4vw,2.8rem);line-height:1}p{color:var(--muted)}main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;padding:16px}aside,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 26px rgba(15,23,42,.06)}aside{padding:14px;height:calc(100vh - 112px);overflow:auto}.stage{min-height:0}canvas{display:block;width:100%;height:auto;background:linear-gradient(#fbfdff,#eef4f8);border:1px solid var(--line);border-radius:12px}label{display:grid;grid-template-columns:112px 1fr 72px;gap:7px;align-items:center;margin:8px 0;font-weight:750;font-size:.86rem}label input[type=range]{grid-column:2}label output{grid-column:3;text-align:right;color:var(--teal);font-weight:900}input[type=range]{width:100%;accent-color:var(--teal)}select,button,input[type=number]{font:inherit;border:1px solid #c9d4df;border-radius:8px;padding:8px 9px;background:#fff;color:var(--ink)}button{cursor:pointer;font-weight:850}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:12px}.readout{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.readout span{display:block;color:var(--muted);font-size:.76rem;font-weight:850;text-transform:uppercase;letter-spacing:.04em}.readout strong{display:block;margin-top:4px;font-size:1.05rem}.formula{margin-top:12px;padding:12px;border:1px solid #dbe7f2;border-radius:10px;background:#f8fbff;color:#364152}.toplinks{margin-top:8px}.toplinks a{color:var(--blue);font-weight:850;text-decoration:none}@media(max-width:900px){main{grid-template-columns:1fr}aside{height:auto}}</style></head>
<body><header><h1>Ciclos termodinamicos PV</h1><p>Diagrama P-V para gas ideal: isotermas, trabajo y ciclo rectangular editable.</p><div class="toplinks"><a href="./">Volver a Physics</a></div></header><main><aside><label>P baja<input id="P1" type="range" min="40" max="180" step="1" value="70"><output id="P1Out">70</output></label><label>P alta<input id="P2" type="range" min="80" max="300" step="1" value="180"><output id="P2Out">180</output></label><label>V bajo<input id="V1" type="range" min="1" max="5" step="0.1" value="1.8"><output id="V1Out">1.8</output></label><label>V alto<input id="V2" type="range" min="3" max="10" step="0.1" value="6"><output id="V2Out">6.0</output></label><label>Moles n<input id="nGas" type="range" min="0.2" max="3" step="0.1" value="1"><output id="nGasOut">1.0</output></label></aside><section class="stage"><canvas id="world" width="1400" height="820"></canvas><div class="readouts"><div class="readout"><span>Trabajo ciclo</span><strong id="workRead"></strong></div><div class="readout"><span>T baja</span><strong id="t1Read"></strong></div><div class="readout"><span>T alta</span><strong id="t2Read"></strong></div><div class="readout"><span>Sentido</span><strong id="senseRead"></strong></div></div><div class="panel formula">Para gas ideal: PV=nRT. El area encerrada en el diagrama P-V representa el trabajo neto del ciclo.</div></section></main><script>
const $=s=>document.querySelector(s),canvas=$('#world'),ctx=canvas.getContext('2d');
function clear(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fbfdff';ctx.fillRect(0,0,canvas.width,canvas.height)}
function grid(){ctx.strokeStyle='rgba(23,32,47,.08)';ctx.lineWidth=1;for(let x=0;x<canvas.width;x+=70){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()}for(let y=0;y<canvas.height;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}}
function line(x1,y1,x2,y2,c='#17202f',w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function circle(x,y,r,c,w=2,fill=null){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke()}

function px(V){return 120+(V/10)*1160}function py(P){return 720-(P/320)*600}function draw(){clear();grid();const p1=+P1.value,p2=+P2.value,v1=+V1.value,v2=+V2.value,n=+nGas.value,R=.08314;P1Out.textContent=p1;P2Out.textContent=p2;V1Out.textContent=v1.toFixed(1);V2Out.textContent=v2.toFixed(1);nGasOut.textContent=n.toFixed(1);line(120,720,1300,720,'#17202f',3);line(120,720,120,100,'#17202f',3);ctx.fillStyle='#17202f';ctx.fillText('V',1280,750);ctx.fillText('P',90,110);ctx.strokeStyle='#0b63ce';ctx.lineWidth=4;ctx.beginPath();ctx.rect(px(v1),py(p2),px(v2)-px(v1),py(p1)-py(p2));ctx.stroke();ctx.fillStyle='rgba(11,99,206,.10)';ctx.fill();ctx.strokeStyle='#d89818';ctx.lineWidth=2;for(const T of [200,400,700,1000]){ctx.beginPath();let first=true;for(let V=.8;V<=10;V+=.04){const P=n*R*T/V;if(P>320)continue;const x=px(V),y=py(P);if(first){ctx.moveTo(x,y);first=false}else ctx.lineTo(x,y)}ctx.stroke()}const W=(p2-p1)*(v2-v1);workRead.textContent=W.toFixed(1)+' u';t1Read.textContent=(p1*v1/(n*R)).toFixed(0)+' K';t2Read.textContent=(p2*v2/(n*R)).toFixed(0)+' K';senseRead.textContent=W>0?'horario produce trabajo':'antihorario';requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
