<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Orbitas gravitatorias | Physics</title><style>:root{--ink:#17202f;--muted:#607083;--paper:#f7f9fb;--panel:#fff;--line:#d9e2ec;--blue:#0b63ce;--teal:#087f8c;--gold:#d89818;--red:#d64545;--green:#14845f}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}header{padding:20px 24px;border-bottom:1px solid var(--line);background:#fff}h1{margin:0 0 6px;font-size:clamp(1.7rem,4vw,2.8rem);line-height:1}p{color:var(--muted)}main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;padding:16px}aside,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 26px rgba(15,23,42,.06)}aside{padding:14px;height:calc(100vh - 112px);overflow:auto}.stage{min-height:0}canvas{display:block;width:100%;height:auto;background:linear-gradient(#fbfdff,#eef4f8);border:1px solid var(--line);border-radius:12px}label{display:grid;grid-template-columns:112px 1fr 72px;gap:7px;align-items:center;margin:8px 0;font-weight:750;font-size:.86rem}label input[type=range]{grid-column:2}label output{grid-column:3;text-align:right;color:var(--teal);font-weight:900}input[type=range]{width:100%;accent-color:var(--teal)}select,button,input[type=number]{font:inherit;border:1px solid #c9d4df;border-radius:8px;padding:8px 9px;background:#fff;color:var(--ink)}button{cursor:pointer;font-weight:850}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:12px}.readout{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.readout span{display:block;color:var(--muted);font-size:.76rem;font-weight:850;text-transform:uppercase;letter-spacing:.04em}.readout strong{display:block;margin-top:4px;font-size:1.05rem}.formula{margin-top:12px;padding:12px;border:1px solid #dbe7f2;border-radius:10px;background:#f8fbff;color:#364152}.toplinks{margin-top:8px}.toplinks a{color:var(--blue);font-weight:850;text-decoration:none}@media(max-width:900px){main{grid-template-columns:1fr}aside{height:auto}}</style></head>
<body><header><h1>Orbitas gravitatorias</h1><p>Movimiento bajo gravedad central: velocidad inicial, masa central, energia y trayectorias.</p><div class="toplinks"><a href="./">Volver a Physics</a></div></header><main><aside><label>Masa central<input id="mass" type="range" min="0.5" max="8" step="0.1" value="2"><output id="massOut">2.0</output></label><label>Velocidad inicial<input id="v0" type="range" min="0.1" max="2.8" step="0.01" value="1.05"><output id="v0Out">1.05</output></label><label>Radio inicial<input id="r0" type="range" min="140" max="380" step="1" value="260"><output id="r0Out">260</output></label><label>Paso temporal<input id="dtScale" type="range" min="0.2" max="3" step="0.1" value="1"><output id="dtScaleOut">1.0</output></label><div class="row"><button id="pause">Pausar</button><button id="reset" class="primary">Reiniciar</button></div></aside><section class="stage"><canvas id="world" width="1400" height="820"></canvas><div class="readouts"><div class="readout"><span>Energia</span><strong id="energyRead"></strong></div><div class="readout"><span>Velocidad</span><strong id="speedRead"></strong></div><div class="readout"><span>Tipo</span><strong id="typeRead"></strong></div><div class="readout"><span>Rastro</span><strong id="trailRead"></strong></div></div><div class="panel formula">Para una masa de prueba: a = -GM r/r^3. Si E<0 la orbita queda ligada; si E>=0 puede escapar.</div></section></main><script>
const $=s=>document.querySelector(s),canvas=$('#world'),ctx=canvas.getContext('2d');
function clear(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fbfdff';ctx.fillRect(0,0,canvas.width,canvas.height)}
function grid(){ctx.strokeStyle='rgba(23,32,47,.08)';ctx.lineWidth=1;for(let x=0;x<canvas.width;x+=70){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()}for(let y=0;y<canvas.height;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}}
function line(x1,y1,x2,y2,c='#17202f',w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function circle(x,y,r,c,w=2,fill=null){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke()}

let run=true,trail=[];let p,v;function init(){p={x:+r0.value,y:0};v={x:0,y:+v0.value};trail=[]}function step(){const M=+mass.value,G=16000,sc=+dtScale.value/80;for(let k=0;k<3;k++){const r=Math.hypot(p.x,p.y),a=-G*M/(r*r*r);v.x+=a*p.x*sc;v.y+=a*p.y*sc;p.x+=v.x*sc;p.y+=v.y*sc}}function draw(){clear();grid();massOut.textContent=(+mass.value).toFixed(1);v0Out.textContent=(+v0.value).toFixed(2);r0Out.textContent=(+r0.value).toFixed(0);dtScaleOut.textContent=(+dtScale.value).toFixed(1);if(run)step();const cx=700,cy=410;trail.push({x:p.x,y:p.y});if(trail.length>1800)trail.shift();ctx.strokeStyle='#0b63ce';ctx.lineWidth=2;ctx.beginPath();trail.forEach((q,i)=>{const x=cx+q.x,y=cy-q.y;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();circle(cx,cy,28,'#d89818',3,'#f7c35f');circle(cx+p.x,cy-p.y,10,'#0b63ce',2,'#0b63ce');const M=+mass.value,G=16000,r=Math.hypot(p.x,p.y),speed=Math.hypot(v.x,v.y),E=.5*speed*speed-G*M/r;energyRead.textContent=E.toFixed(1);speedRead.textContent=speed.toFixed(2);typeRead.textContent=E<0?'ligada':'escape';trailRead.textContent=trail.length+' pts';requestAnimationFrame(draw)}pause.onclick=()=>{run=!run;pause.textContent=run?'Pausar':'Continuar'};reset.onclick=init;init();requestAnimationFrame(draw);
</script></body></html>
