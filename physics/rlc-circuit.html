<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Circuito RLC | Physics</title><style>:root{--ink:#17202f;--muted:#607083;--paper:#f7f9fb;--panel:#fff;--line:#d9e2ec;--blue:#0b63ce;--teal:#087f8c;--gold:#d89818;--red:#d64545;--green:#14845f}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}header{padding:20px 24px;border-bottom:1px solid var(--line);background:#fff}h1{margin:0 0 6px;font-size:clamp(1.7rem,4vw,2.8rem);line-height:1}p{color:var(--muted)}main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;padding:16px}aside,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 26px rgba(15,23,42,.06)}aside{padding:14px;height:calc(100vh - 112px);overflow:auto}.stage{min-height:0}canvas{display:block;width:100%;height:auto;background:linear-gradient(#fbfdff,#eef4f8);border:1px solid var(--line);border-radius:12px}label{display:grid;grid-template-columns:112px 1fr 72px;gap:7px;align-items:center;margin:8px 0;font-weight:750;font-size:.86rem}label input[type=range]{grid-column:2}label output{grid-column:3;text-align:right;color:var(--teal);font-weight:900}input[type=range]{width:100%;accent-color:var(--teal)}select,button,input[type=number]{font:inherit;border:1px solid #c9d4df;border-radius:8px;padding:8px 9px;background:#fff;color:var(--ink)}button{cursor:pointer;font-weight:850}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:12px}.readout{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.readout span{display:block;color:var(--muted);font-size:.76rem;font-weight:850;text-transform:uppercase;letter-spacing:.04em}.readout strong{display:block;margin-top:4px;font-size:1.05rem}.formula{margin-top:12px;padding:12px;border:1px solid #dbe7f2;border-radius:10px;background:#f8fbff;color:#364152}.toplinks{margin-top:8px}.toplinks a{color:var(--blue);font-weight:850;text-decoration:none}@media(max-width:900px){main{grid-template-columns:1fr}aside{height:auto}}</style></head>
<body><header><h1>Circuito RLC</h1><p>Circuito RLC serie en CA: impedancia, resonancia, desfase y amplitud de corriente.</p><div class="toplinks"><a href="./">Volver a Physics</a></div></header><main><aside><label>Resistencia R<input id="R" type="range" min="1" max="300" step="1" value="80"><output id="ROut">80</output></label><label>Inductancia L<input id="L" type="range" min="0.01" max="1.5" step="0.01" value="0.35"><output id="LOut">0.35</output></label><label>Capacidad C<input id="C" type="range" min="1" max="500" step="1" value="80"><output id="COut">80</output></label><label>Frecuencia f<input id="freq" type="range" min="1" max="500" step="1" value="60"><output id="freqOut">60</output></label><label>Tension V0<input id="V0" type="range" min="1" max="24" step="0.1" value="12"><output id="V0Out">12.0</output></label></aside><section class="stage"><canvas id="world" width="1400" height="820"></canvas><div class="readouts"><div class="readout"><span>Impedancia</span><strong id="zRead"></strong></div><div class="readout"><span>Corriente maxima</span><strong id="iRead"></strong></div><div class="readout"><span>Fase</span><strong id="phiRead"></strong></div><div class="readout"><span>Resonancia</span><strong id="frRead"></strong></div></div><div class="panel formula">Z=sqrt(R^2+(omega L-1/(omega C))^2). La corriente se maximiza cerca de f0=1/(2 pi sqrt(LC)).</div></section></main><script>
const $=s=>document.querySelector(s),canvas=$('#world'),ctx=canvas.getContext('2d');
function clear(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fbfdff';ctx.fillRect(0,0,canvas.width,canvas.height)}
function grid(){ctx.strokeStyle='rgba(23,32,47,.08)';ctx.lineWidth=1;for(let x=0;x<canvas.width;x+=70){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()}for(let y=0;y<canvas.height;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}}
function line(x1,y1,x2,y2,c='#17202f',w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function circle(x,y,r,c,w=2,fill=null){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke()}

let t=0,last=performance.now();function draw(now){const dt=Math.min(.04,(now-last)/1000);last=now;t+=dt;clear();grid();const Rv=+R.value,Lv=+L.value,Cv=+C.value/1e6,f=+freq.value,V=+V0.value,w=2*Math.PI*f,XL=w*Lv,XC=1/(w*Cv),X=XL-XC,Z=Math.hypot(Rv,X),I=V/Z,phi=Math.atan2(X,Rv),f0=1/(2*Math.PI*Math.sqrt(Lv*Cv));ROut.textContent=Rv;LOut.textContent=Lv.toFixed(2);COut.textContent=(+C.value).toFixed(0);freqOut.textContent=f;V0Out.textContent=V.toFixed(1);zRead.textContent=Z.toFixed(1)+' ohm';iRead.textContent=I.toFixed(3)+' A';phiRead.textContent=(phi*180/Math.PI).toFixed(1)+' deg';frRead.textContent=f0.toFixed(1)+' Hz';line(120,250,1280,250,'#17202f',4);line(120,560,1280,560,'#17202f',4);ctx.strokeStyle='#0b63ce';ctx.lineWidth=3;ctx.beginPath();for(let x=120;x<=1280;x++){const u=(x-120)/1160*4*Math.PI,y=420-120*Math.sin(u+w*t);if(x===120)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();ctx.strokeStyle='#d64545';ctx.beginPath();for(let x=120;x<=1280;x++){const u=(x-120)/1160*4*Math.PI,y=420-120*Math.sin(u+w*t-phi);if(x===120)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();ctx.fillStyle='#0b63ce';ctx.fillText('V(t)',1180,285);ctx.fillStyle='#d64545';ctx.fillText('I(t)',1180,315);circle(380,250,34,'#087f8c',4);ctx.fillStyle='#17202f';ctx.fillText('R',372,255);line(580,250,640,250,'#17202f',4);for(let i=0;i<6;i++)circle(665+i*26,250,13,'#17202f',3);ctx.fillText('L',740,220);line(920,218,920,282,'#17202f',5);line(955,218,955,282,'#17202f',5);ctx.fillText('C',930,205);requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script><script data-range-output-editor>
(function(){
  if (window.__rangeOutputEditorInstalled) return;
  window.__rangeOutputEditorInstalled = true;
  function firstNumber(text, fallback){
    const m = String(text || '').replace(',', '.').match(/-?\d+(?:\.\d+)?(?:e[+-]?\d+)?/i);
    return m ? m[0] : String(fallback ?? '0');
  }
  function clampToRange(value, range){
    let v = Number(value);
    const min = range.min !== '' ? Number(range.min) : -Infinity;
    const max = range.max !== '' ? Number(range.max) : Infinity;
    if (Number.isFinite(min)) v = Math.max(min, v);
    if (Number.isFinite(max)) v = Math.min(max, v);
    return v;
  }
  document.addEventListener('click', function(ev){
    const out = ev.target.closest && ev.target.closest('output');
    if (!out || out.dataset.editing === '1') return;
    const label = out.closest('label');
    const range = label ? label.querySelector('input[type="range"]') : null;
    if (!range) return;
    ev.preventDefault();
    ev.stopPropagation();
    const editor = document.createElement('input');
    editor.type = 'number';
    editor.value = firstNumber(out.textContent, range.value);
    if (range.min !== '') editor.min = range.min;
    if (range.max !== '') editor.max = range.max;
    editor.step = range.step && range.step !== 'any' ? range.step : 'any';
    editor.style.width = '82px';
    editor.style.maxWidth = '100%';
    editor.style.padding = '5px 6px';
    editor.style.border = '1px solid #0b63ce';
    editor.style.borderRadius = '7px';
    editor.style.font = 'inherit';
    editor.style.fontWeight = '900';
    editor.style.color = '#087f8c';
    editor.style.textAlign = 'right';
    let finished = false;
    function restore(){
      if (editor.isConnected) editor.replaceWith(out);
      out.dataset.editing = '0';
    }
    function commit(){
      if (finished) return;
      finished = true;
      const raw = editor.value.trim().replace(',', '.');
      const value = Number(raw);
      if (Number.isFinite(value)) {
        range.value = String(clampToRange(value, range));
        range.dispatchEvent(new Event('input', {bubbles:true}));
        range.dispatchEvent(new Event('change', {bubbles:true}));
      }
      restore();
    }
    function cancel(){
      if (finished) return;
      finished = true;
      restore();
    }
    out.dataset.editing = '1';
    out.replaceWith(editor);
    editor.focus();
    editor.select();
    editor.addEventListener('keydown', function(e){
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') cancel();
    });
    editor.addEventListener('blur', commit);
  }, true);
})();
</script></body></html>
