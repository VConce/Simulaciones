<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tiro parabolico | Physics</title><script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"]]},svg:{fontCache:"global"}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script><style>:root{--ink:#17202f;--muted:#607083;--paper:#f7f9fb;--panel:#fff;--line:#d9e2ec;--blue:#0b63ce;--teal:#087f8c;--gold:#d89818;--red:#d64545}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}header{padding:22px 24px;border-bottom:1px solid var(--line);background:#fff}h1{margin:0 0 6px;font-size:clamp(1.8rem,4vw,3rem);line-height:1}p{color:var(--muted)}main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;padding:16px}aside,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 26px rgba(15,23,42,.06)}aside{padding:14px;height:calc(100vh - 118px);overflow:auto}.panel{padding:14px}.stage{min-height:0}canvas{display:block;width:100%;height:auto;background:linear-gradient(#fbfdff,#eef4f8);border:1px solid var(--line);border-radius:12px;touch-action:none}label{display:grid;gap:6px;margin:12px 0;font-weight:700;font-size:.92rem}.inline{grid-template-columns:1fr auto;align-items:center;gap:10px}input[type=range]{width:100%;accent-color:var(--teal)}input[type=color]{width:42px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:#fff}select,button{font:inherit;border:1px solid #c9d4df;border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink)}button{cursor:pointer;font-weight:800}button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}.readout{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.readout span{display:block;color:var(--muted);font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.readout strong{display:block;margin-top:4px;font-size:1.1rem}.formula{padding:12px;margin-top:12px;border:1px solid #dbe7f2;border-radius:10px;background:#f8fbff;overflow:auto}.modes{display:grid;gap:7px;margin-top:10px}.modes button{text-align:left}.toplinks{margin-top:10px}.toplinks a{color:var(--blue);font-weight:800;text-decoration:none}@media(max-width:900px){main{grid-template-columns:1fr}aside{height:auto}}</style></head><body><header><h1>Tiro parabolico</h1><p>Movimiento con gravedad y lecturas ideales de alcance y altura.</p><div class="toplinks"><a href="./">Volver a Physics</a></div></header><main><aside><label class="inline">Parametro A <output id="ao">1.00</output><input id="a" type="range" min="0" max="2" step="0.01" value="1"></label><label class="inline">Parametro B <output id="bo">1.00</output><input id="b" type="range" min="0" max="2" step="0.01" value="1"></label><div class="row"><button id="pause">Pausar</button><button id="clear">Borrar</button></div><label class="inline">Color<input id="color" type="color" value="#0b63ce"></label></aside><section class="stage"><canvas id="world" width="1400" height="820"></canvas><div class="readouts"><div class="readout"><span>Lectura</span><strong id="r1"></strong></div><div class="readout"><span>Estado</span><strong id="r2"></strong></div></div><div class="panel formula" id="formula">\(x=v_0\cos\theta\,t,\quad y=v_0\sin\theta\,t-\frac12gt^2\)</div></section></main><script>const c=world,ctx=c.getContext('2d');let v0=75,ang=42,g=9.81,path=[];function sim(){path=[];for(let t=0;t<20;t+=.03){let x=v0*Math.cos(ang*Math.PI/180)*t,y=v0*Math.sin(ang*Math.PI/180)*t-.5*g*t*t;if(y<0&&t>0)break;path.push({x,y})}}function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#d9e2ec';for(let x=0;x<c.width;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke()}ctx.strokeStyle=color.value;ctx.lineWidth=4;ctx.beginPath();path.forEach((p,i)=>{let sx=90+p.x*10,sy=720-p.y*10;if(i)ctx.lineTo(sx,sy);else ctx.moveTo(sx,sy)});ctx.stroke();r1.textContent='R = '+((v0*v0*Math.sin(2*ang*Math.PI/180))/g).toFixed(1)+' m';r2.textContent='H = '+((v0*Math.sin(ang*Math.PI/180))**2/(2*g)).toFixed(1)+' m'}function update(){sim();draw()}a.oninput=e=>{v0=10+140*+e.target.value/2;ao.textContent=(+e.target.value).toFixed(2);update()};b.oninput=e=>{ang=85*+e.target.value/2;bo.textContent=(+e.target.value).toFixed(2);update()};pause.onclick=update;clear.onclick=()=>{path=[];draw()};update();</script></body></html>
